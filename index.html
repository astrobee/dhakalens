<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DHakaLens — Know the City. Know the Rules.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Amiri:ital,wght@1,400&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-900:#13252F;
    --primary-700:#1F4D52;
    --primary-500:#347C70;
    --bg:#0A0F14;
    --surface:#131B22;
    --surface-2:#1B252D;
    --text-900:#F1F6F5;
    --text-600:#8DA0A3;
    --border:rgba(255,255,255,.09);
    --glow:#4FE3C4;
    --glow-soft:rgba(79,227,196,.28);
    --glow-text:#08201A;
    --card-shadow:0 10px 28px rgba(0,0,0,.45);
    --safe:#3FCB84;
    --info:#5B9CE8;
    --attn:#E0AE4E;
    --risk:#E68F52;
    --crit:#EB6A57;
    --unknown:#8B959A;
    --ink:#13252F;
    --mint:#DCEEE2;
    --mint-deep:#B8DCC4;
    --radius-sm:8px;
    --radius-md:10px;
    --radius-lg:16px;
    --radius-xl:20px;
    --radius-sheet:24px;
    --font-en: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-bn: "Noto Sans Bengali", "Noto Sans", var(--font-en);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F6F8F7; --surface:#FFFFFF; --surface-2:#F0F3F2; --text-900:#172026; --text-600:#59666B; --border:#DCE3E2;
    --glow:#347C70; --glow-soft:rgba(52,124,112,.18); --glow-text:#FFFFFF; --card-shadow:0 2px 8px rgba(20,40,36,.06);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text-900);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,227,196,.07), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(52,124,112,.10), transparent 40%);
    background-attachment:fixed;
    font-family:var(--font-en);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  :root[data-theme="light"] body{ background-image:none; }
  body.lang-bn, body.lang-bn *{ font-family: var(--font-bn); }
  button{font-family:inherit;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- Top chrome ---------- */
  .topbar{
    position:sticky; top:0; z-index:40; background:var(--primary-900); color:#fff;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px; text-align:left; background:none; color:inherit; font-family:inherit;}
  .brand svg{flex:none;}
  .brand-name{font-size:17px;}
  .brand-tag{display:block; font-size:11px; font-weight:500; color:#B8CFC9; margin-top:1px;}
  .topctrls{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;}
  .pill-toggle{
    display:flex; background:rgba(255,255,255,.1); border-radius:999px; padding:3px; gap:2px;
  }
  .pill-toggle button{
    border:none; background:transparent; color:#CFE0DC; font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .pill-toggle button.active{background:#fff; color:var(--primary-900);}

  /* ---------- Shell / layout ---------- */
  .shell{max-width:1180px; margin:0 auto; display:flex; min-height:calc(100vh - 56px);}
  .sidebar{
    width:230px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:20px 12px; display:flex; flex-direction:column; gap:2px;
  }
  .sidebar h4{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); margin:14px 8px 6px; font-weight:700;}
  .navlink{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--radius-md);
    color:var(--text-900); text-decoration:none; font-size:14px; font-weight:600; cursor:pointer; border:none; background:transparent; width:100%; text-align:left;
  }
  .navlink .ic{width:20px; text-align:center; font-size:16px;}
  .navlink.active{background:var(--glow); color:var(--glow-text); font-weight:800; box-shadow:0 0 14px var(--glow-soft);}
  .navlink:not(.active):hover{background:var(--bg);}

  .content{flex:1; min-width:0; padding:22px 22px 90px;}
  .device-mobile .sidebar{display:none;}
  .device-mobile .content{padding:14px 14px 90px;}
  .device-mobile .shell{max-width:430px; border-left:1px solid var(--border); border-right:1px solid var(--border); min-height:auto;}
  .device-mobile{background:#DCE3E2; padding:24px 0;}
  @media (max-width:880px){
    .sidebar{display:none;}
    .content{padding:14px 14px 90px;}
  }

  .bottomnav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));}
  .device-mobile .bottomnav{display:flex; position:sticky; margin-top:auto;}
  @media (max-width:880px){ .bottomnav{display:flex;} }
  .bottomnav-inner{display:flex; max-width:430px; margin:0 auto; width:100%;}
  .bnav-btn{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:transparent; color:var(--text-600); font-size:10.5px; font-weight:600; padding:4px 4px; cursor:pointer; border-radius:10px;}
  .bnav-btn .label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .bnav-btn .ic{font-size:19px;}
  .bnav-btn.active{color:var(--primary-700);}
  .bnav-btn.report .ic{background:var(--primary-500); color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:1px;}

  h1,h2,h3{margin:0 0 4px; line-height:1.25;}
  .h-display{font-size:26px; font-weight:800;}
  .h1{font-size:22px; font-weight:800;}
  .h2{font-size:17px; font-weight:700;}
  .h3{font-size:14.5px; font-weight:700;}
  .muted{color:var(--text-600);}
  .small{font-size:12.5px;}
  p{line-height:1.55;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;
    box-shadow:var(--card-shadow); transition:border-color .2s ease;
  }
  .card:hover{ border-color:var(--glow-soft); }
  .card + .card{margin-top:12px;}
  .grid{display:grid; gap:12px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-3 > *{ min-width:0; }
  @media (max-width:560px){ .grid-3{grid-template-columns:repeat(2,1fr);} }

  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:11px 14px; font-size:14px; color:var(--text-600);
  }
  .searchbar input{border:none; outline:none; background:transparent; width:100%; font-size:14px; color:var(--text-900); font-family:inherit;}

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; color:var(--text-900); white-space:nowrap;
  }
  .chip.active{background:var(--primary-700); border-color:var(--primary-700); color:#fff;}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap;}

  .badge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:6px;}
  .badge-act{background:#FBE7E2; color:#9C3A22;}
  .badge-policy{background:#E4F0EC; color:#1F4D52;}
  .badge-plan{background:#FCF1DA; color:#8A5C10;}
  .badge-rule{background:#E1EAF8; color:#28518F;}
  .badge-regulation{background:#EAE3F6; color:#5B3C9C;}
  .badge-guideline{background:#EDEFEF; color:#4A5457;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-md); border:none;
    padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--primary-700); color:#fff;}
  .btn-primary:disabled{background:var(--border); color:var(--text-600); cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--primary-700); border:1px solid var(--primary-700);}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:var(--radius-sm);}
  .btn-block{width:100%;}

  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;} .gap12{gap:12px;}

  .indicator{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .indicator:last-child{border-bottom:none;}
  .meter{width:110px; height:7px; border-radius:99px; background:var(--border); overflow:hidden; flex:none;}
  .meter > span{display:block; height:100%; background:var(--glow); border-radius:99px; transition:width .35s ease;}

  .score-ring{
    width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:conic-gradient(var(--glow) calc(var(--pct,50)*1%), var(--border) 0);
    filter:drop-shadow(0 0 10px var(--glow-soft));
  }
  .score-ring-inner{width:74px; height:74px; border-radius:50%; background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .score-ring-inner b{font-size:22px; line-height:1; color:var(--glow);}
  .score-ring-inner span{font-size:10px; color:var(--text-600);}

  .issue-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (max-width:480px){ .issue-grid{grid-template-columns:repeat(2,1fr);} }
  .issue-tile{
    border:1.5px solid var(--border); border-radius:var(--radius-md); padding:14px 8px; text-align:center; cursor:pointer; background:var(--surface);
  }
  .issue-tile .ic{font-size:22px; display:block; margin-bottom:6px;}
  .issue-tile.active{border-color:var(--primary-500); background:#EAF3F0;}

  .steps-track{display:flex; gap:5px; margin-bottom:16px;}
  .steps-track > div{flex:1; height:4px; border-radius:99px; background:var(--border);}
  .steps-track > div.done{background:var(--primary-500);}

  textarea, .textinput{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px; font-size:14px;
    font-family:inherit; color:var(--text-900); background:var(--surface); outline:none;
  }
  textarea{resize:vertical; min-height:84px;}
  label.field-label{font-size:12.5px; font-weight:700; color:var(--text-600); display:block; margin-bottom:6px;}
  select.textinput{appearance:none;}

  .upload-box{
    border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; cursor:pointer; background:var(--bg);
  }
  .upload-box input{display:none;}

  .checkline{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius-md); cursor:pointer; margin-bottom:8px; background:var(--surface);}
  .checkline input{width:17px; height:17px; accent-color:var(--primary-500);}
  .checkline.checked{border-color:var(--primary-500); background:#EAF3F0;}

  .timeline{display:flex; flex-direction:column; gap:0; margin-top:4px;}
  .tstep{display:flex; gap:10px; align-items:flex-start;}
  .tstep .dot{width:10px; height:10px; border-radius:50%; background:var(--primary-500); margin-top:5px; flex:none;}
  .tstep .line{width:1.5px; flex:1; background:var(--border); margin:2px 0 2px 4.25px;}
  .tstep-body{padding-bottom:16px; font-size:13px;}

  .toggle2{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px; width:fit-content;}
  .toggle2 button{border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-600);}
  .toggle2 button.active{background:var(--primary-700); color:#fff;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--border);}
  th{color:var(--text-600); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .tbl-wrap{overflow-x:auto;}

  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;}

  /* ---------- Quick action tiles (reference-style multi-colour grid) ---------- */
  .qa-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .qa-tile{
    border-radius:var(--radius-lg); padding:16px; color:#fff; cursor:pointer; border:none; text-align:left;
    box-shadow:0 6px 16px rgba(20,30,28,.16); font-family:inherit;
  }
  .qa-tile .qa-ic{ font-size:22px; display:block; margin-bottom:10px; }
  .qa-tile .qa-title{ font-weight:800; font-size:13.5px; line-height:1.25; }
  .qa-tile .qa-sub{ font-size:11px; opacity:.85; margin-top:3px; line-height:1.3; }
  .qa-teal{ background:linear-gradient(135deg, var(--ink), var(--primary-700)); }
  .qa-blue{ background:linear-gradient(135deg, var(--primary-700), var(--primary-500)); }
  .qa-orange{ background:var(--mint); color:var(--ink); }
  .qa-orange .qa-sub{ color:var(--primary-700); opacity:1; }
  .qa-purple{ background:linear-gradient(135deg, var(--primary-500), var(--mint-deep)); }

  /* ---------- Colourful stat chip (icon + number + progress bar) ---------- */
  .stat-chip{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--card-shadow); }
  .stat-chip .sc-top{ display:flex; align-items:center; justify-content:space-between; }
  .sc-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .stat-chip .sc-trend{ font-size:11px; font-weight:800; }
  .stat-chip .sc-value{ font-size:21px; font-weight:800; margin-top:10px; line-height:1.1; }
  .stat-chip .sc-label{ font-size:11.5px; color:var(--text-600); margin-top:2px; }
  .stat-chip .sc-bar{ height:5px; border-radius:99px; background:var(--border); margin-top:10px; overflow:hidden; }
  .stat-chip .sc-bar > span{ display:block; height:100%; border-radius:99px; }

  /* ---------- Today's Conditions — organic blob cards ---------- */
  .conditions-panel{
    background:linear-gradient(160deg, var(--ink) 0%, #0E211F 100%); border-radius:var(--radius-xl);
    padding:18px; color:#fff;
  }
  .blob-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  .blob-card{
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
    box-shadow:0 6px 16px rgba(0,0,0,.22);
    border-radius:24px 30px 26px 32px / 30px 24px 32px 26px;
    padding:16px; color:#fff; display:flex; flex-direction:column; gap:8px;
  }
  .blob-wide{ grid-column:1 / -1; border-radius:26px; }
  .blob-icwrap{
    width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .blob-label{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:rgba(255,255,255,.75); font-weight:700; }
  .blob-value{ font-size:26px; font-weight:800; line-height:1.1; }
  .blob-value small{ font-size:13px; font-weight:600; opacity:.7; margin-left:2px; }
  .blob-sub{ font-size:11px; color:rgba(255,255,255,.62); line-height:1.4; }
  .blob-wide .blob-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .blob-scale{ display:flex; height:6px; border-radius:99px; overflow:hidden; margin-top:2px; width:100%; }
  .blob-scale span{ flex:1; }
  .blob-live{ display:inline-block; font-size:9px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--glow); }

  /* ---------- Profile screen ---------- */
  .profile-hero{
    border-radius:var(--radius-lg); padding:20px; color:#fff;
    background:linear-gradient(135deg, var(--ink), var(--primary-700));
    display:flex; align-items:center; gap:16px; box-shadow:var(--card-shadow);
  }
  .profile-avatar{
    width:64px; height:64px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--mint); color:var(--ink); font-weight:800; font-size:22px; border:3px solid rgba(255,255,255,.3);
  }
  .auth-option{
    display:flex; align-items:center; gap:12px; width:100%; padding:13px 16px; border-radius:var(--radius-md);
    border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:700; color:var(--text-900); margin-bottom:10px; text-align:left;
  }
  .auth-option:hover{ border-color:var(--glow-soft); }
  .auth-option .ic-wrap{ width:34px; height:34px; border-radius:9px; background:var(--mint); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .chat-input-bar{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border);
    border-radius:999px; padding:6px 6px 6px 16px; margin-top:6px;
  }
  .chat-input-bar input{ flex:1; border:none; outline:none; background:transparent; font-size:13.5px; color:var(--text-900); font-family:inherit; }
  .chat-send-btn{
    flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--ink); color:var(--mint);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* ---------- Notification panel ---------- */
  .notif-wrap{ position:relative; }
  .notif-badge{
    position:absolute; top:-3px; right:-3px; background:var(--crit); color:#fff; font-size:9px; font-weight:800;
    min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;
    border:1.5px solid var(--primary-900);
  }
  .notif-panel{
    position:absolute; top:42px; right:0; width:320px; max-width:88vw; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:0 16px 36px rgba(0,0,0,.28);
    z-index:70; max-height:70vh; overflow-y:auto; text-align:left; color:var(--text-900);
  }
  .notif-panel-head{ padding:13px 14px 10px; font-weight:800; font-size:13px; border-bottom:1px solid var(--border); }
  .notif-item{ display:flex; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; align-items:flex-start; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--bg); }
  .notif-ic{ width:32px; height:32px; border-radius:9px; background:var(--mint); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .notif-empty{ padding:22px 14px; text-align:center; color:var(--text-600); font-size:13px; }

  /* ---------- Emergency panel (deliberately off-palette — urgency should look different) ---------- */
  .emergency-btn{
    display:flex; align-items:center; gap:10px; width:100%; background:var(--crit); color:#fff;
    border:none; border-radius:var(--radius-lg); padding:13px 16px; font-weight:800; font-size:14px; cursor:pointer;
    box-shadow:0 6px 16px rgba(196,67,46,.35);
  }
  .emergency-btn .ic-wrap{ width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; flex:none; }
  .emergency-card{
    background:#FBEAE7; border:1.5px solid #EFC2B8; border-radius:var(--radius-lg); padding:16px; margin-bottom:12px;
  }
  .emergency-card .em-tel{
    display:inline-flex; align-items:center; gap:8px; background:var(--crit); color:#fff; font-weight:800; font-size:20px;
    padding:8px 16px; border-radius:999px; text-decoration:none; margin-top:8px;
  }
  .sim-banner{
    background:repeating-linear-gradient(135deg, #3A2A0A, #3A2A0A 10px, #241A06 10px, #241A06 20px);
    border:2px solid #E0AE4E; border-radius:var(--radius-md); padding:13px 14px; color:#FCEBC2; margin-bottom:14px;
  }
  .sim-banner b{ color:#FFD87A; }
  .incident-card{ background:var(--surface); border:1.5px solid var(--crit); border-radius:var(--radius-lg); padding:14px; margin-bottom:10px; }

  /* ---------- Contribution heatmap ---------- */
  .heatmap-wrap{ overflow-x:auto; padding-bottom:2px; }
  .heatmap-months{ position:relative; height:14px; margin-bottom:2px; }
  .heatmap-months span{ position:absolute; font-size:9px; color:var(--text-600); top:0; }
  .heatmap-weeks{ display:flex; gap:2px; }
  .heatmap-week{ display:flex; flex-direction:column; gap:2px; }
  .heatmap-cell{ width:10px; height:10px; border-radius:2px; flex:none; }
  .heatmap-legend{ display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-600); margin-top:8px; justify-content:flex-end; }
  .kpi b{font-size:24px; display:block;}

  .map-mock{
    position:relative; border-radius:var(--radius-lg); overflow:hidden; height:180px;
    background:
      linear-gradient(135deg, #DCEAE6 0%, #C9DED8 100%);
    border:1px solid var(--border);
  }
  .map-mock svg{position:absolute; inset:0; width:100%; height:100%;}
  .map-pin{position:absolute; transform:translate(-50%,-100%); cursor:pointer;}
  .map-pin .dotpin{width:14px; height:14px; border-radius:50% 50% 50% 0; background:var(--primary-700); transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .map-pin.risk .dotpin{background:var(--crit);}
  .map-pin.attn .dotpin{background:var(--attn);}

  .modal-backdrop{position:fixed; inset:0; background:rgba(10,18,16,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
  .device-mobile .modal-backdrop, .modal-backdrop.center{align-items:center;}
  .sheet{
    background:var(--surface); width:100%; max-width:480px; border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    max-height:85vh; overflow-y:auto; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .modal-backdrop.center .sheet{border-radius:var(--radius-lg); max-height:88vh;}
  .sheet-handle{width:38px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 14px;}
  .sheet-close{position:sticky; top:0; float:right; background:var(--bg); border:none; border-radius:50%; width:30px; height:30px; font-size:15px; cursor:pointer; color:var(--text-600);}

  .toast{position:fixed; bottom:calc(84px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--primary-900); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:100; box-shadow:0 6px 18px rgba(0,0,0,.2);}

  .lang-split{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .lang-split .bn{color:var(--text-600); font-family:var(--font-bn);}

  .footer-note{font-size:11.5px; color:var(--text-600); text-align:center; margin-top:18px;}

  /* ---------- Front page (editorial "dispatch" style) ---------- */
  .word-dhaka{ font-family:'Space Grotesk', var(--font-en); }
  .word-lens{ font-family:'Amiri', serif; font-style:italic; font-weight:400; }
  .cover{
    position:relative; min-height:100vh; display:flex; flex-direction:column;
    background:linear-gradient(180deg, #B7C9B3 0%, #93AC93 40%, #4C6B5C 100%);
    color:#20301F; overflow:hidden;
  }
  .dispatch-nav{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:calc(18px + env(safe-area-inset-top,0px)) 22px 6px;
  }
  .dispatch-nav-logo{ display:flex; align-items:center; gap:8px; font-weight:700; color:#1F2E1D; }
  .dispatch-nav-logo svg{ color:#1F2E1D; }
  .dispatch-lang{ display:flex; background:rgba(255,255,255,.4); border-radius:999px; padding:3px; }
  .dispatch-lang button{ border:none; background:transparent; color:#26361F; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; cursor:pointer; }
  .dispatch-lang button.active{ background:#1F2E1D; color:#EFF3E9; }
  .dispatch-hero{ text-align:center; padding:18px 20px 4px; position:relative; z-index:1; }
  .dispatch-label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#2E4127; font-weight:700; }
  .dispatch-headline{
    font-family:'Playfair Display', 'Noto Sans Bengali', serif; font-weight:600;
    font-size:clamp(30px,7vw,50px); color:#182417; line-height:1.16; margin:14px 0 0; letter-spacing:-0.01em;
  }
  .dispatch-headline em{ font-style:italic; font-weight:500; color:#3E5A3C; }
  body.lang-bn .dispatch-headline em{ font-style:normal; font-weight:700; color:#3E5A3C; }
  .dispatch-sub{ max-width:460px; margin:16px auto 0; color:#2E4127; font-size:14px; line-height:1.6; opacity:.9; }
  .dispatch-cta{
    display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.75); border-radius:999px; padding:6px;
    max-width:400px; margin:22px auto 0; backdrop-filter:blur(6px); cursor:pointer;
  }
  .dispatch-cta-hint{ flex:1; text-align:left; padding-left:12px; font-size:13px; color:#2E4127; opacity:.75; }
  .dispatch-cta-btn{
    flex:none; background:#1B2A18; color:#EFF3E9; border:none; border-radius:999px;
    padding:10px 22px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .dispatch-caption{ font-size:11px; color:#2E4127; opacity:.75; margin-top:10px; }
  .dispatch-art{ flex:1; position:relative; margin-top:22px; min-height:220px; background:#4C6B5C; }
  .dispatch-art img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; display:block;
    filter:grayscale(1) sepia(1) hue-rotate(75deg) saturate(2.2) brightness(0.62) contrast(1.05);
    mix-blend-mode:luminosity; opacity:.9;
  }
  .dispatch-art::before{
    content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, #4C6B5C 0%, rgba(76,107,92,.55) 12%, transparent 32%);
  }
  .dispatch-art::after{
    content:""; position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, transparent 65%, rgba(15,22,14,.4) 100%);
    pointer-events:none;
  }

  /* ---------- Radial photo-burst hero (cover) ---------- */
  .radial-hero{ position:relative; width:min(84vw, 380px); aspect-ratio:1/1; margin:4px auto 0; }
  .radial-lines{ position:absolute; inset:0; width:100%; height:100%; z-index:1; overflow:visible; }
  .radial-lines path{ stroke:rgba(255,255,255,.4); stroke-width:1.4; stroke-dasharray:3 4; fill:none; }
  .radial-lines circle{ fill:rgba(255,255,255,.55); }
  .radial-center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34%; aspect-ratio:1/1;
    border-radius:50%; overflow:hidden; z-index:3; box-shadow:0 10px 28px rgba(0,0,0,.4);
    border:3px solid rgba(255,255,255,.3);
    background:radial-gradient(circle at 35% 30%, var(--primary-500), var(--primary-900) 75%);
  }
  .radial-center-mark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; animation:centerPulse 4.5s ease-in-out infinite; }
  @keyframes centerPulse{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(255,255,255,0)); } 50%{ filter:drop-shadow(0 0 10px rgba(255,255,255,.55)); } }
  .radial-petal{
    position:absolute; width:29%; aspect-ratio:1/0.85; transform:translate(-50%,-50%);
    border-radius:14px; overflow:hidden; z-index:2; border:2px solid rgba(255,255,255,.28);
    box-shadow:0 6px 16px rgba(0,0,0,.35); opacity:0; animation:petalIn .65s cubic-bezier(.2,.8,.3,1) forwards;
    clip-path:polygon(14% 0%,100% 0%,100% 86%,86% 100%,0% 100%,0% 14%);
    cursor:pointer; background:var(--primary-700);
  }
  .radial-petal img, .radial-petal svg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .radial-petal-label{
    position:absolute; left:0; right:0; bottom:0; padding:5px 7px 4px; font-size:9px; font-weight:800; color:#fff;
    background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); letter-spacing:.02em;
  }
  .radial-petal-fallback{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:var(--primary-700); font-size:20px; }
  @keyframes petalIn{ from{ opacity:0; transform:translate(-50%,-50%) scale(.5); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  @media (prefers-reduced-motion: reduce){ .radial-petal{ animation:none; opacity:1; } .radial-center-mark{ animation:none; } }
  .brand-mark{ cursor:pointer; background:none; border:none; padding:0; display:flex; }

  /* ---------- Page hero (ties main screens back to the cover's palette) ---------- */
  .page-hero{
    display:flex; align-items:center; gap:14px; padding:17px 18px; border-radius:var(--radius-lg);
    margin-bottom:16px; color:#fff;
    background:
      radial-gradient(circle at 100% 0%, rgba(255,255,255,.14), transparent 55%),
      linear-gradient(135deg, var(--primary-900), var(--primary-700));
  }
  .page-hero-ic{
    flex:none; width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .page-hero-title{ font-size:18px; font-weight:800; line-height:1.2; }
  .page-hero-sub{ font-size:12px; color:#CFE0DC; margin-top:3px; line-height:1.4; }

  ::selection{background:var(--primary-500); color:#fff;}
  a{color:var(--primary-700);}
  .icbtn{border:none; background:rgba(255,255,255,.12); color:#fff; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;}
</style>
<script src="config.js"></script>

         enforcement:"Violations may result in a written notice to the responsible party, an order for restoration at the violator's cost, and a fine for repeated or wilful violations. WASA and the relevant City Corporation share enforcement responsibility and are the first point of contact for citizen reports under this Guideline."},
     bn:{purpose:"এই নির্দেশিকা ঢাকা শহরের সরকারি বৃষ্টির পানি ও বর্জ্য পানি নিষ্কাশন নালা রক্ষণাবেক্ষণ, সুরক্ষা ও ব্যবহার নিয়ন্ত্রণ করে, যাতে স্বাভাবিক ও ভারী বৃষ্টির সময় পানি অবাধে প্রবাহিত হতে পারে। 'নালা' বলতে সিটি করপোরেশন বা ওয়াসা কর্তৃক রক্ষণাবেক্ষণকৃত যেকোনো সরকারি খাল, কালভার্ট, বক্স-ড্রেন বা প্রকৌশলগত চ্যানেল বোঝায়।",
         provisions:"(১) কোনো ব্যক্তি সরকারি নালা বা জলপ্রবাহে কঠিন বর্জ্য, পলি, নির্মাণ সামগ্রী বা অপরিশোধিত বর্জ্য নিষ্কাশন করতে পারবেন না। (২) যেকোনো নির্মাণ বা ভূমি উন্নয়ন কার্যক্রমে পর্যাপ্ত অন-সাইট নিষ্কাশন ব্যবস্থা থাকতে হবে এবং বিদ্যমান সরকারি নালা বাধাগ্রস্ত বা সংকীর্ণ করা যাবে না। (৩) বন্ধ, ক্ষতিগ্রস্ত বা উপচে পড়া নালা রিপোর্ট হলে তা পরিদর্শন করে, নিশ্চিত হলে, দায়িত্বপ্রাপ্ত কর্তৃপক্ষের নির্ধারিত যুক্তিসঙ্গত সময়ের মধ্যে পরিষ্কার বা মেরামত করতে হবে।",
         enforcement:"লঙ্ঘনের ক্ষেত্রে দায়ী পক্ষকে লিখিত নোটিশ, লঙ্ঘনকারীর খরচে পুনরুদ্ধারের আদেশ এবং বারবার বা ইচ্ছাকৃত লঙ্ঘনের জন্য জরিমানা হতে পারে। ওয়াসা ও সংশ্লিষ্ট সিটি করপোরেশন যৌথভাবে প্রয়োগের দায়িত্বে থাকে এবং এই নির্দেশিকার আওতায় নাগরিক রিপোর্টের প্রথম যোগাযোগস্থল।"}}},
  {id:"p2", topic:"waterbody", type:"ACT",
   title:{en:"Waterbody Protection Act", bn:"জলাশয় সংরক্ষণ আইন"},
   summary:{en:"Protects rivers, canals, ponds and lakes from unauthorised filling or conversion of use.", bn:"অননুমোদিত ভরাট বা ব্যবহার পরিবর্তন থেকে নদী, খাল, পুকুর ও হ্রদ রক্ষা করে।"},
   simple:{en:"Filling in or building on a natural waterbody generally requires prior government approval, and unauthorised filling can be reversed.", bn:"প্রাকৃতিক জলাশয় ভরাট বা তার উপর নির্মাণ সাধারণত সরকারি পূর্বানুমোদন প্রয়োজন, অননুমোদিত ভরাট বাতিলযোগ্য।"},
   original:{en:"Any change in the character or use of a designated waterbody requires prior approval from the competent authority, and unauthorised filling may be subject to restoration orders.", bn:"চিহ্নিত জলাশয়ের প্রকৃতি বা ব্যবহারে যেকোনো পরিবর্তনের জন্য সক্ষম কর্তৃপক্ষের পূর্বানুমোদন প্রয়োজন; অননুমোদিত ভরাট পুনরুদ্ধার আদেশের আওতায় পড়তে পারে।"},
   authority:{en:"RAJUK / Department of Environment", bn:"রাজউক / পরিবেশ অধিদপ্তর"}, status:"Current",
   points:{en:["Filling a pond, canal or lake usually needs prior approval — report suspected unauthorised filling.","Note the waterbody's name and approximate area affected.","RAJUK or DoE can order restoration of unauthorised filling."],
           bn:["পুকুর, খাল বা হ্রদ ভরাটের জন্য সাধারণত পূর্বানুমোদন প্রয়োজন — সন্দেহজনক অননুমোদিত ভরাট রিপোর্ট করুন।","জলাশয়ের নাম ও আনুমানিক প্রভাবিত এলাকা উল্লেখ করুন।","রাজউক বা পরিবেশ অধিদপ্তর অননুমোদিত ভরাট পুনরুদ্ধারের আদেশ দিতে পারে।"]},
   fullDoc:{
     en:{purpose:"This Act protects rivers, canals, ponds, lakes and other natural waterbodies within Dhaka from unauthorised filling, encroachment or conversion of use, in recognition of their role in drainage, flood control and the urban environment.",
         provisions:"(1) No person shall fill, reclaim, or alter the boundary of a designated waterbody without prior written approval from the competent authority. (2) An application to alter a waterbody's use must include a justification and shall be reviewed against the applicable land-use and environmental plans. (3) Unauthorised filling identified by the authority is subject to a restoration order requiring removal of fill material and reinstatement of the waterbody, at the responsible party's cost.",
         enforcement:"RAJUK and the Department of Environment jointly enforce this Act. Restoration orders, fines, and referral for further legal action may follow confirmed violations; citizen reports of suspected unauthorised filling are received and investigated by either authority."},
     bn:{purpose:"এই আইন ঢাকার নদী, খাল, পুকুর, হ্রদ ও অন্যান্য প্রাকৃতিক জলাশয়কে অননুমোদিত ভরাট, দখল বা ব্যবহার পরিবর্তন থেকে রক্ষা করে, কারণ এগুলো নিষ্কাশন, বন্যা নিয়ন্ত্রণ ও নগর পরিবেশে গুরুত্বপূর্ণ ভূমিকা পালন করে।",
         provisions:"(১) সক্ষম কর্তৃপক্ষের লিখিত পূর্বানুমোদন ছাড়া কোনো ব্যক্তি চিহ্নিত জলাশয় ভরাট, পুনরুদ্ধার বা সীমানা পরিবর্তন করতে পারবেন না। (২) জলাশয়ের ব্যবহার পরিবর্তনের আবেদনে যুক্তি অন্তর্ভুক্ত থাকতে হবে এবং প্রযোজ্য ভূমি ব্যবহার ও পরিবেশগত পরিকল্পনার বিপরীতে পর্যালোচনা করা হবে। (৩) কর্তৃপক্ষ কর্তৃক শনাক্ত অননুমোদিত ভরাট দায়ী পক্ষের খরচে ভরাট উপাদান অপসারণ ও জলাশয় পুনরুদ্ধারের আদেশের আওতায় পড়ে।",
         enforcement:"রাজউক ও পরিবেশ অধিদপ্তর যৌথভাবে এই আইন কার্যকর করে। নিশ্চিত লঙ্ঘনের ক্ষেত্রে পুনরুদ্ধার আদেশ, জরিমানা এবং আরও আইনি ব্যবস্থার জন্য প্রেরণ হতে পারে; সন্দেহজনক অননুমোদিত ভরাটের নাগরিক রিপোর্ট উভয় কর্তৃপক্ষ গ্রহণ ও তদন্ত করে।"}}},
  {id:"p3", topic:"footpath", type:"RULE",
   title:{en:"Footpath & Pedestrian Access Rules", bn:"ফুটপাত ও পথচারী প্রবেশাধিকার বিধি"},
   summary:{en:"Keeps footpaths clear for pedestrians and sets conditions for any temporary use.", bn:"পথচারীদের জন্য ফুটপাত পরিষ্কার রাখে এবং সাময়িক ব্যবহারের শর্ত নির্ধারণ করে।"},
   simple:{en:"Footpaths are meant for walking; using them for parking, storage or permanent structures without permission is generally not allowed.", bn:"ফুটপাত হাঁটার জন্য; অনুমতি ছাড়া পার্কিং, মালামাল রাখা বা স্থায়ী স্থাপনার জন্য ব্যবহার সাধারণত অনুমোদিত নয়।"},
   original:{en:"A public footpath shall not be occupied, obstructed, or used for private storage or construction except under a permit issued by the local authority.", bn:"স্থানীয় কর্তৃপক্ষের অনুমতি ব্যতীত সরকারি ফুটপাত দখল, বাধাগ্রস্ত বা ব্যক্তিগত মালামাল রাখা বা নির্মাণের জন্য ব্যবহার করা যাবে না।"},
   authority:{en:"City Corporation", bn:"সিটি করপোরেশন"}, status:"Current",
   points:{en:["A footpath used for parking or storage can be reported to the city corporation.","Note whether pedestrians, especially wheelchair users, are physically blocked.","A permit may exist for temporary use — ask before assuming a violation."],
           bn:["পার্কিং বা মালামাল রাখার জন্য ব্যবহৃত ফুটপাত সিটি করপোরেশনে রিপোর্ট করা যায়।","পথচারী, বিশেষত হুইলচেয়ার ব্যবহারকারীরা শারীরিকভাবে বাধাগ্রস্ত কিনা লক্ষ্য করুন।","সাময়িক ব্যবহারের অনুমতি থাকতে পারে — লঙ্ঘন ধরে নেওয়ার আগে যাচাই করুন।"]},
   fullDoc:{
     en:{purpose:"These Rules keep public footpaths clear and safe for pedestrian use, including for people with mobility impairments, and set the conditions under which any temporary or exceptional use may be permitted.",
         provisions:"(1) A public footpath shall not be occupied, obstructed, or used for private parking, storage, or construction, except under a written permit issued by the local authority. (2) Any permitted temporary use must preserve a minimum clear walking width and must not compromise pedestrian safety. (3) Structures, goods, or vehicles found on a footpath without a valid permit may be removed by the authority without further notice.",
         enforcement:"The City Corporation enforces these Rules and may issue a removal order, a fine, or both. Repeated obstruction at the same location may result in the permit (if any) being revoked."},
     bn:{purpose:"এই বিধি পথচারীদের ব্যবহারের জন্য, প্রতিবন্ধী ব্যক্তিদের জন্যও, সরকারি ফুটপাত পরিষ্কার ও নিরাপদ রাখে এবং যেসব শর্তে সাময়িক বা ব্যতিক্রমী ব্যবহারের অনুমতি দেওয়া যেতে পারে তা নির্ধারণ করে।",
         provisions:"(১) স্থানীয় কর্তৃপক্ষের লিখিত অনুমতি ব্যতীত সরকারি ফুটপাত দখল, বাধাগ্রস্ত বা ব্যক্তিগত পার্কিং, মালামাল রাখা বা নির্মাণের জন্য ব্যবহার করা যাবে না। (২) অনুমোদিত সাময়িক ব্যবহারে ন্যূনতম পরিষ্কার হাঁটার প্রশস্ততা বজায় রাখতে হবে এবং পথচারী নিরাপত্তা ক্ষুণ্ণ করা যাবে না। (৩) বৈধ অনুমতি ছাড়া ফুটপাতে পাওয়া স্থাপনা, মালামাল বা যানবাহন কর্তৃপক্ষ অতিরিক্ত নোটিশ ছাড়াই অপসারণ করতে পারে।",
         enforcement:"সিটি করপোরেশন এই বিধি কার্যকর করে এবং অপসারণ আদেশ, জরিমানা বা উভয়ই জারি করতে পারে। একই স্থানে বারবার বাধা সৃষ্টি হলে বিদ্যমান অনুমতি (যদি থাকে) বাতিল হতে পারে।"}}},
  {id:"p4", topic:"construction", type:"REGULATION",
   title:{en:"Building Construction Regulation", bn:"ভবন নির্মাণ বিধিমালা"},
   summary:{en:"Governs approvals, setbacks and safety standards required before and during construction.", bn:"নির্মাণের আগে ও চলাকালীন প্রয়োজনীয় অনুমোদন, সেটব্যাক ও নিরাপত্তা মান নির্ধারণ করে।"},
   simple:{en:"Most new construction or major renovation needs an approved plan first, including setbacks from roads and neighbouring plots.", bn:"বেশিরভাগ নতুন নির্মাণ বা বড় সংস্কারের জন্য প্রথমে অনুমোদিত নকশা প্রয়োজন, রাস্তা ও পার্শ্ববর্তী জমি থেকে সেটব্যাকসহ।"},
   original:{en:"No person shall commence construction requiring statutory approval without first obtaining a sanctioned building plan from the competent authority.", bn:"সক্ষম কর্তৃপক্ষের অনুমোদিত নির্মাণ নকশা ছাড়া কোনো ব্যক্তি সংবিধিবদ্ধ অনুমোদন প্রয়োজন এমন নির্মাণ শুরু করতে পারবেন না।"},
   authority:{en:"RAJUK", bn:"রাজউক"}, status:"Current",
   points:{en:["Ask to see the approved building plan on site if construction looks unusual.","Unsafe construction near a footpath or road can be reported to RAJUK.","Note the plot address and any visible safety hazard."],
           bn:["নির্মাণ অস্বাভাবিক মনে হলে সাইটে অনুমোদিত নকশা দেখতে চাইতে পারেন।","ফুটপাত বা রাস্তার কাছে অনিরাপদ নির্মাণ রাজউকে রিপোর্ট করা যায়।","প্লটের ঠিকানা ও দৃশ্যমান নিরাপত্তা ঝুঁকি উল্লেখ করুন।"]},
   fullDoc:{
     en:{purpose:"This Regulation governs the approval, setback, and safety standards required for construction and major renovation within the RAJUK planning area, to protect structural safety, neighbouring properties, and the surrounding infrastructure.",
         provisions:"(1) No person shall commence construction requiring statutory approval without first obtaining a sanctioned building plan from RAJUK. (2) Construction must observe the setback, height, and density limits applicable to the plot's designated zone. (3) The sanctioned plan and a copy of the approval must be displayed at the construction site and produced on request by an authorised inspector.",
         enforcement:"Unauthorised construction is subject to a stop-work order, and where necessary, demolition of the unauthorised portion at the owner's cost, in addition to any applicable fine. RAJUK is the primary enforcement authority."},
     bn:{purpose:"এই বিধিমালা রাজউকের পরিকল্পনা এলাকার মধ্যে নির্মাণ ও বড় সংস্কারের জন্য প্রয়োজনীয় অনুমোদন, সেটব্যাক ও নিরাপত্তা মান নির্ধারণ করে, যাতে কাঠামোগত নিরাপত্তা, পার্শ্ববর্তী সম্পত্তি ও আশেপাশের অবকাঠামো রক্ষা পায়।",
         provisions:"(১) রাজউকের অনুমোদিত নির্মাণ নকশা ছাড়া কোনো ব্যক্তি সংবিধিবদ্ধ অনুমোদন প্রয়োজন এমন নির্মাণ শুরু করতে পারবেন না। (২) নির্মাণে প্লটের চিহ্নিত অঞ্চলের জন্য প্রযোজ্য সেটব্যাক, উচ্চতা ও ঘনত্ব সীমা মেনে চলতে হবে। (৩) অনুমোদিত নকশা ও অনুমোদনের একটি অনুলিপি নির্মাণ সাইটে প্রদর্শন করতে হবে এবং অনুমোদিত পরিদর্শকের অনুরোধে দেখাতে হবে।",
         enforcement:"অননুমোদিত নির্মাণের ক্ষেত্রে কাজ বন্ধের আদেশ এবং প্রয়োজনে মালিকের খরচে অননুমোদিত অংশ ভাঙার আদেশ, প্রযোজ্য জরিমানাসহ, হতে পারে। রাজউক প্রধান প্রয়োগকারী কর্তৃপক্ষ।"}}},
  {id:"p5", topic:"green", type:"POLICY",
   title:{en:"Urban Green Space Policy", bn:"নগর সবুজায়ন নীতিমালা"},
   summary:{en:"Encourages protection and expansion of parks, roadside trees and open green space.", bn:"পার্ক, রাস্তার পাশের গাছ ও উন্মুক্ত সবুজ এলাকা সংরক্ষণ ও সম্প্রসারণ উৎসাহিত করে।"},
   simple:{en:"Public green space and mature trees are meant to be preserved; removal of protected trees generally needs authority clearance.", bn:"সরকারি সবুজ এলাকা ও পরিণত গাছ সংরক্ষণের উদ্দেশ্যে; সংরক্ষিত গাছ অপসারণে সাধারণত কর্তৃপক্ষের অনুমতি প্রয়োজন।"},
   original:{en:"Designated green spaces shall be maintained for public use and shall not be converted to another use without a documented planning justification.", bn:"চিহ্নিত সবুজ এলাকা জনসাধারণের ব্যবহারের জন্য রক্ষণাবেক্ষণ করতে হবে এবং লিখিত পরিকল্পনা যুক্তি ছাড়া অন্য কাজে রূপান্তর করা যাবে না।"},
   authority:{en:"City Corporation / Department of Environment", bn:"সিটি করপোরেশন / পরিবেশ অধিদপ্তর"}, status:"Current",
   points:{en:["Removal of a mature or protected tree usually needs clearance — report unexplained tree removal.","Note the number of trees and approximate age if possible.","City corporation or DoE can clarify if a permit was issued."],
           bn:["পরিণত বা সংরক্ষিত গাছ অপসারণে সাধারণত অনুমতি প্রয়োজন — অব্যাখ্যাত গাছ অপসারণ রিপোর্ট করুন।","সম্ভব হলে গাছের সংখ্যা ও আনুমানিক বয়স উল্লেখ করুন।","সিটি করপোরেশন বা পরিবেশ অধিদপ্তর অনুমতি ইস্যু হয়েছিল কিনা জানাতে পারে।"]},
   fullDoc:{
     en:{purpose:"This Policy protects and encourages the expansion of parks, roadside trees, and open green space across Dhaka, in recognition of their role in reducing heat, improving air quality, and supporting public wellbeing.",
         provisions:"(1) A designated public green space shall be maintained for public use and shall not be converted to another use without a documented planning justification reviewed by the City Corporation and Department of Environment. (2) Removal of a mature or protected tree requires prior clearance from the relevant authority, except where necessary for public safety. (3) Any development affecting a green space of significant size must include a replacement or compensatory greening plan.",
         enforcement:"Unauthorised removal of protected trees or conversion of green space may result in a restoration or replanting order and a fine. The City Corporation and Department of Environment jointly oversee enforcement."},
     bn:{purpose:"এই নীতিমালা ঢাকাজুড়ে পার্ক, রাস্তার পাশের গাছ ও উন্মুক্ত সবুজ এলাকা সংরক্ষণ ও সম্প্রসারণ উৎসাহিত করে, কারণ এগুলো তাপ হ্রাস, বায়ুর মান উন্নয়ন ও জনস্বাস্থ্যে ভূমিকা রাখে।",
         provisions:"(১) চিহ্নিত সরকারি সবুজ এলাকা জনসাধারণের ব্যবহারের জন্য রক্ষণাবেক্ষণ করতে হবে এবং সিটি করপোরেশন ও পরিবেশ অধিদপ্তর কর্তৃক পর্যালোচিত লিখিত পরিকল্পনা যুক্তি ছাড়া অন্য কাজে রূপান্তর করা যাবে না। (২) পরিণত বা সংরক্ষিত গাছ অপসারণের জন্য সংশ্লিষ্ট কর্তৃপক্ষের পূর্বানুমতি প্রয়োজন, জনসাধারণের নিরাপত্তার জন্য প্রয়োজনীয় ক্ষেত্র ব্যতীত। (৩) উল্লেখযোগ্য আকারের সবুজ এলাকা প্রভাবিত করে এমন যেকোনো উন্নয়নে প্রতিস্থাপন বা ক্ষতিপূরণমূলক সবুজায়ন পরিকল্পনা অন্তর্ভুক্ত থাকতে হবে।",
         enforcement:"সংরক্ষিত গাছের অননুমোদিত অপসারণ বা সবুজ এলাকা রূপান্তরের ক্ষেত্রে পুনরুদ্ধার বা পুনরায় রোপণের আদেশ এবং জরিমানা হতে পারে। সিটি করপোরেশন ও পরিবেশ অধিদপ্তর যৌথভাবে প্রয়োগ তদারকি করে।"}}},
  {id:"p6", topic:"waste", type:"RULE",
   title:{en:"Solid Waste Management Rules", bn:"কঠিন বর্জ্য ব্যবস্থাপনা বিধি"},
   summary:{en:"Sets requirements for waste segregation, collection points and disposal.", bn:"বর্জ্য পৃথকীকরণ, সংগ্রহস্থল ও অপসারণের শর্ত নির্ধারণ করে।"},
   simple:{en:"Household and commercial waste is expected to go through designated collection points rather than open dumping on streets or in waterbodies.", bn:"বাসাবাড়ি ও বাণিজ্যিক বর্জ্য রাস্তায় বা জলাশয়ে ফেলার পরিবর্তে নির্ধারিত সংগ্রহস্থলের মাধ্যমে অপসারণ করা প্রত্যাশিত।"},
   original:{en:"Solid waste shall be deposited only at designated collection points and shall not be dumped on public roads, drains, or waterbodies.", bn:"কঠিন বর্জ্য শুধুমাত্র নির্ধারিত সংগ্রহস্থলে জমা দিতে হবে এবং সরকারি রাস্তা, নালা বা জলাশয়ে ফেলা যাবে না।"},
   authority:{en:"City Corporation", bn:"সিটি করপোরেশন"}, status:"Current",
   points:{en:["Open dumping on roads, drains or waterbodies can be reported to the city corporation.","Repeated dumping at the same spot is useful evidence for planners.","Ask about the nearest designated collection point."],
           bn:["রাস্তা, নালা বা জলাশয়ে খোলা বর্জ্য ফেলা সিটি করপোরেশনে রিপোর্ট করা যায়।","একই স্থানে বারবার বর্জ্য ফেলা প্ল্যানারদের জন্য গুরুত্বপূর্ণ তথ্য।","নিকটতম নির্ধারিত সংগ্রহস্থল সম্পর্কে জিজ্ঞাসা করুন।"]},
   fullDoc:{
     en:{purpose:"These Rules govern the segregation, collection, and disposal of household and commercial solid waste within the city, to keep public spaces, drains, and waterbodies free of dumped waste.",
         provisions:"(1) Solid waste shall be deposited only at a designated collection point or handed to an authorised collection service, and shall not be dumped on a public road, drain, or waterbody. (2) Waste generators are encouraged to segregate organic and recyclable waste at source, in line with City Corporation collection schedules. (3) Bulk or construction waste requires separate arrangement with the City Corporation and shall not be left on a public footpath or road.",
         enforcement:"Open dumping is subject to a fine and, for repeated violations at the same site, a higher penalty. The City Corporation enforces these Rules and operates the designated collection points."},
     bn:{purpose:"এই বিধি শহরের মধ্যে বাসাবাড়ি ও বাণিজ্যিক কঠিন বর্জ্য পৃথকীকরণ, সংগ্রহ ও অপসারণ নিয়ন্ত্রণ করে, যাতে সরকারি স্থান, নালা ও জলাশয় ফেলা বর্জ্যমুক্ত থাকে।",
         provisions:"(১) কঠিন বর্জ্য শুধুমাত্র নির্ধারিত সংগ্রহস্থলে জমা দিতে হবে বা অনুমোদিত সংগ্রহ সেবায় হস্তান্তর করতে হবে, এবং সরকারি রাস্তা, নালা বা জলাশয়ে ফেলা যাবে না। (২) সিটি করপোরেশনের সংগ্রহ সময়সূচি অনুযায়ী বর্জ্য উৎপাদনকারীদের উৎসেই জৈব ও পুনর্ব্যবহারযোগ্য বর্জ্য পৃথক করতে উৎসাহিত করা হয়। (৩) বড় পরিমাণ বা নির্মাণ বর্জ্যের জন্য সিটি করপোরেশনের সাথে পৃথক ব্যবস্থা প্রয়োজন এবং তা সরকারি ফুটপাত বা রাস্তায় ফেলে রাখা যাবে না।",
         enforcement:"খোলা স্থানে বর্জ্য ফেলার জন্য জরিমানা এবং একই স্থানে বারবার লঙ্ঘনের জন্য উচ্চতর জরিমানা হতে পারে। সিটি করপোরেশন এই বিধি কার্যকর করে এবং নির্ধারিত সংগ্রহস্থল পরিচালনা করে।"}}},
  {id:"p7", topic:"parking", type:"GUIDELINE",
   title:{en:"On-street Parking Guideline", bn:"রাস্তার পার্কিং নির্দেশিকা"},
   summary:{en:"Indicates where on-street parking is and isn't permitted, and how it interacts with traffic flow.", bn:"রাস্তায় কোথায় পার্কিং অনুমোদিত এবং তা যানজটে কীভাবে প্রভাব ফেলে তা নির্দেশ করে।"},
   simple:{en:"Parking is generally discouraged on primary roads and near intersections where it blocks traffic or pedestrian visibility.", bn:"প্রধান সড়কে ও মোড়ের কাছে পার্কিং সাধারণত নিরুৎসাহিত করা হয় যেখানে এটি যানজট বা দৃশ্যমানতা বাধাগ্রস্ত করে।"},
   original:{en:"Vehicles shall not be parked in a manner that obstructs traffic flow, pedestrian crossings, or emergency access.", bn:"যানবাহন এমনভাবে পার্ক করা যাবে না যা যানচলাচল, পথচারী ক্রসিং বা জরুরি প্রবেশাধিকার বাধাগ্রস্ত করে।"},
   authority:{en:"Traffic Police / DMP", bn:"ট্রাফিক পুলিশ / ডিএমপি"}, status:"Current",
   points:{en:["Vehicles blocking a crossing, footpath or intersection can be reported to traffic police.","Note the vehicle type and approximate time — avoid publishing number plates.","Recurring illegal parking at one spot helps planners prioritise enforcement."],
           bn:["ক্রসিং, ফুটপাত বা মোড় আটকে রাখা যানবাহন ট্রাফিক পুলিশে রিপোর্ট করা যায়।","যানবাহনের ধরন ও আনুমানিক সময় উল্লেখ করুন — নম্বর প্লেট প্রকাশ এড়িয়ে চলুন।","একই স্থানে বারবার অবৈধ পার্কিং প্ল্যানারদের অগ্রাধিকার নির্ধারণে সাহায্য করে।"]},
   fullDoc:{
     en:{purpose:"This Guideline indicates where on-street parking is and is not permitted, to balance vehicle parking needs against traffic flow, pedestrian safety, and emergency access.",
         provisions:"(1) Vehicles shall not be parked in a manner that obstructs traffic flow, a pedestrian crossing, a footpath, or emergency access. (2) Parking on a primary road or within a defined distance of an intersection is generally restricted unless a designated parking bay is marked. (3) Areas may be designated as no-parking zones by signage or road markings, which take precedence over general practice.",
         enforcement:"Traffic Police and the DMP enforce this Guideline through fines, towing, or both, for vehicles parked in violation. Recurring illegal parking at the same location may be escalated for stricter enforcement."},
     bn:{purpose:"এই নির্দেশিকা নির্দেশ করে কোথায় রাস্তায় পার্কিং অনুমোদিত এবং কোথায় নয়, যাতে যানবাহন পার্কিংয়ের প্রয়োজন যানচলাচল, পথচারী নিরাপত্তা ও জরুরি প্রবেশাধিকারের সাথে সামঞ্জস্যপূর্ণ থাকে।",
         provisions:"(১) যানবাহন এমনভাবে পার্ক করা যাবে না যা যানচলাচল, পথচারী ক্রসিং, ফুটপাত বা জরুরি প্রবেশাধিকার বাধাগ্রস্ত করে। (২) প্রধান সড়কে বা মোড়ের নির্দিষ্ট দূরত্বের মধ্যে পার্কিং সাধারণত সীমাবদ্ধ, যদি না নির্ধারিত পার্কিং বে চিহ্নিত থাকে। (৩) সাইনবোর্ড বা রাস্তার চিহ্ন দ্বারা এলাকাকে নো-পার্কিং জোন হিসেবে চিহ্নিত করা যেতে পারে, যা সাধারণ প্রথার চেয়ে অগ্রাধিকার পায়।",
         enforcement:"ট্রাফিক পুলিশ ও ডিএমপি এই নির্দেশিকা লঙ্ঘনকারী যানবাহনের জন্য জরিমানা, টোয়িং বা উভয়ের মাধ্যমে কার্যকর করে। একই স্থানে বারবার অবৈধ পার্কিং কঠোরতর প্রয়োগের জন্য উর্ধ্বতন কর্তৃপক্ষে পাঠানো হতে পারে।"}}},
  {id:"p8", topic:"noise", type:"RULE",
   title:{en:"Noise Pollution Control Rules", bn:"শব্দদূষণ নিয়ন্ত্রণ বিধি"},
   summary:{en:"Sets permissible noise levels by area type and time of day.", bn:"এলাকার ধরন ও সময় অনুযায়ী অনুমোদিত শব্দমাত্রা নির্ধারণ করে।"},
   simple:{en:"Different zones — residential, mixed, commercial, silent — have different noise limits, especially at night.", bn:"বিভিন্ন অঞ্চলে — আবাসিক, মিশ্র, বাণিজ্যিক, নীরব — বিশেষত রাতে ভিন্ন ভিন্ন শব্দসীমা প্রযোজ্য।"},
   original:{en:"No person shall create or permit noise exceeding the prescribed limit for the applicable zone category, particularly between 10 pm and 6 am.", bn:"রাত ১০টা থেকে ভোর ৬টার মধ্যে বিশেষত প্রযোজ্য অঞ্চল শ্রেণির নির্ধারিত সীমার বেশি শব্দ কোনো ব্যক্তি সৃষ্টি বা অনুমতি দিতে পারবেন না।"},
   authority:{en:"Department of Environment", bn:"পরিবেশ অধিদপ্তর"}, status:"Current",
   points:{en:["Note the time of day — night-time limits are stricter than daytime.","Identify the likely source: construction, event, generator, or traffic.","Department of Environment handles most noise complaints."],
           bn:["দিনের কোন সময় তা উল্লেখ করুন — রাতের সীমা দিনের চেয়ে কঠোর।","সম্ভাব্য উৎস চিহ্নিত করুন: নির্মাণ, অনুষ্ঠান, জেনারেটর, বা যানবাহন।","বেশিরভাগ শব্দদূষণ অভিযোগ পরিবেশ অধিদপ্তর দেখে।"]},
   fullDoc:{
     en:{purpose:"These Rules set permissible ambient noise levels by area type — residential, mixed, commercial, and silent zones — and by time of day, to protect public health and quiet enjoyment of neighbourhoods.",
         provisions:"(1) No person shall create or permit noise exceeding the prescribed limit for the applicable zone category, particularly between 10 pm and 6 am. (2) A silent zone (including areas near hospitals, schools, and courts) is subject to a stricter limit at all times. (3) Construction activity, loudspeakers, and generators are subject to additional time-of-day restrictions in residential zones.",
         enforcement:"The Department of Environment enforces these Rules and may issue a warning, a fine, or an order to cease the activity. Repeated violations at commercial premises may result in licence review."},
     bn:{purpose:"এই বিধি এলাকার ধরন — আবাসিক, মিশ্র, বাণিজ্যিক ও নীরব অঞ্চল — এবং দিনের সময় অনুযায়ী অনুমোদিত পরিবেশগত শব্দমাত্রা নির্ধারণ করে, যাতে জনস্বাস্থ্য ও এলাকার শান্তি রক্ষা পায়।",
         provisions:"(১) রাত ১০টা থেকে ভোর ৬টার মধ্যে বিশেষত প্রযোজ্য অঞ্চল শ্রেণির নির্ধারিত সীমার বেশি শব্দ কোনো ব্যক্তি সৃষ্টি বা অনুমতি দিতে পারবেন না। (২) নীরব অঞ্চল (হাসপাতাল, স্কুল ও আদালতের কাছাকাছি এলাকাসহ) সব সময় কঠোরতর সীমার আওতায় পড়ে। (৩) নির্মাণ কার্যক্রম, লাউডস্পিকার ও জেনারেটর আবাসিক অঞ্চলে দিনের সময় অনুযায়ী অতিরিক্ত বিধিনিষেধের আওতায় পড়ে।",
         enforcement:"পরিবেশ অধিদপ্তর এই বিধি কার্যকর করে এবং সতর্কতা, জরিমানা বা কার্যক্রম বন্ধের আদেশ জারি করতে পারে। বাণিজ্যিক প্রতিষ্ঠানে বারবার লঙ্ঘনের ফলে লাইসেন্স পর্যালোচনা হতে পারে।"}}},
  {id:"p9", topic:"landuse", type:"PLAN",

   summary:{en:"The long-range land-use and infrastructure plan guiding development across the Dhaka metropolitan area.", bn:"ঢাকা মহানগর এলাকার উন্নয়ন পরিচালনাকারী দীর্ঘমেয়াদী ভূমি ব্যবহার ও অবকাঠামো পরিকল্পনা।"},
   simple:{en:"Every zone in Dhaka is designated for a general use — residential, commercial, mixed, or protected — which guides what kind of development is expected there.", bn:"ঢাকার প্রতিটি অঞ্চল একটি সাধারণ ব্যবহারের জন্য চিহ্নিত — আবাসিক, বাণিজ্যিক, মিশ্র বা সংরক্ষিত — যা সেখানে কী ধরনের উন্নয়ন প্রত্যাশিত তা নির্দেশ করে।"},
   original:{en:"Development within a designated zone shall conform to the land-use category and density provisions specified for that zone under the Plan.", bn:"চিহ্নিত অঞ্চলের মধ্যে উন্নয়ন পরিকল্পনার অধীনে সেই অঞ্চলের জন্য নির্ধারিত ভূমি ব্যবহার শ্রেণি ও ঘনত্ব বিধানের সাথে সামঞ্জস্যপূর্ণ হতে হবে।"},
   authority:{en:"RAJUK", bn:"রাজউক"}, status:"Current",

           bn:["কোনো ব্যবহার অবৈধ ধরে নেওয়ার আগে স্থানের নির্ধারিত ভূমি ব্যবহার যাচাই করুন।","পরিকল্পনা ও প্রকৃত নির্মাণের মধ্যে অমিল থাকলে তা রিপোর্ট করার মতো বিষয়, অনুমান করার নয়।","রাজউক নির্দিষ্ট প্লটের বর্তমান জোনিং নিশ্চিত করতে পারে।"]},
   fullDoc:{
     en:{purpose:"The Detailed Area Plan sets out the long-range land-use, density, and infrastructure framework guiding development across the Dhaka metropolitan area for the period 2022 to 2035.",

         enforcement:"RAJUK is the primary authority for interpreting and enforcing the Plan. Development inconsistent with the designated zoning may be refused approval, and unauthorised development may be subject to a stop-work or restoration order."},

         provisions:"(১) পরিকল্পনা এলাকার প্রতিটি অঞ্চল একটি প্রধান ভূমি ব্যবহার শ্রেণির জন্য চিহ্নিত — আবাসিক, বাণিজ্যিক, মিশ্র ব্যবহার, শিল্প বা সংরক্ষিত — যা অনুমোদিত উন্নয়নের ধরন ও তীব্রতা নির্দেশ করে। (২) চিহ্নিত অঞ্চলের মধ্যে উন্নয়ন পরিকল্পনার অধীনে সেই অঞ্চলের জন্য নির্ধারিত ভূমি ব্যবহার শ্রেণি ও ঘনত্ব বিধানের সাথে সামঞ্জস্যপূর্ণ হতে হবে। (৩) পরিকল্পনার সাথে অসামঞ্জস্যপূর্ণ প্রস্তাবিত ব্যবহার পরিবর্তনের জন্য জনসাধারণের নোটিশ ও পর্যালোচনাসহ আনুষ্ঠানিক সংশোধন প্রক্রিয়া প্রয়োজন।",
         enforcement:"রাজউক পরিকল্পনা ব্যাখ্যা ও কার্যকর করার প্রধান কর্তৃপক্ষ। চিহ্নিত জোনিংয়ের সাথে অসামঞ্জস্যপূর্ণ উন্নয়ন অনুমোদন প্রত্যাখ্যাত হতে পারে, এবং অননুমোদিত উন্নয়ন কাজ বন্ধ বা পুনরুদ্ধার আদেশের আওতায় পড়তে পারে।"}}},

function explainParagraph(issue, loc, policy){
  if(state.lang==='bn'){
    return `আপনি ${esc(pick(loc))} এলাকায় একটি “${esc(pick(issue))}” সংক্রান্ত সমস্যা দেখেছেন। ${esc(pick(policy.simple))} এই এলাকা ${esc(pick(loc.zone))} হিসেবে চিহ্নিত এবং এখানকার সড়ক ${esc(pick(loc.road))} শ্রেণির। এখানে প্রযোজ্য কর্তৃপক্ষ হলো ${esc(pick(policy.authority))}।`;
  }
  return `You observed a “${esc(pick(issue))}” issue in ${esc(pick(loc))}. ${esc(pick(policy.simple))} This area is designated as ${esc(pick(loc.zone))}, with a ${esc(pick(loc.road)).toLowerCase()} road. The relevant authority here is ${esc(pick(policy.authority))}.`;
}

  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; flex:none;">${ICON_PATHS[name]||''}</svg>`;
}

   title:{en:"Ahsan Manzil", bn:"আহসান মঞ্জিল"}, period:{en:"Built 1859–1872", bn:"নির্মিত ১৮৫৯–১৮৭২"},

        bn:"বুড়িগঙ্গার তীরে অবস্থিত 'পিংক প্যালেস' নবাব খাজা আবদুল গনি নির্মাণ করেন, যেখানে আগে তাঁর পিতা ১৮৩০ সালে কেনা একটি পুরনো ফরাসি বাণিজ্য কুঠি ছিল। ১৮৭২ সালে সম্পূর্ণ হয় এবং তাঁর পুত্র আহসানউল্লাহর নামে নামকরণ করা হয়, এটি ঢাকার প্রভাবশালী নবাব পরিবারের বাসভবন ও কার্যালয় ছিল। ১৮৮৮ সালের ঘূর্ণিঝড় ও ১৮৯৭ সালের ভূমিকম্পে ক্ষতিগ্রস্ত হয়ে প্রতিবারই পুনর্নির্মিত হয়, এবং ১৯৯২ সালে জাদুঘর হিসেবে পুনরায় খোলা হয়।"}},
  {id:"starmosque", icon:iconStarMosque(),
   title:{en:"Star Mosque", bn:"তারা মসজিদ"}, period:{en:"Early–mid 19th century", bn:"১৯ শতকের প্রথমার্ধ"},
   body:{en:"Tara Masjid was built in the first half of the 19th century by local nobleman Mirza Ghulam Pir as a plain Mughal-style mosque. In 1926, a local businessman, Ali Jan Bepari, funded its famous redecoration — hundreds of blue star mosaics made from broken China porcelain, a technique called chinitikri. The mosque grew from three domes to five in a 1987 expansion.",
        bn:"তারা মসজিদ ১৯ শতকের প্রথমার্ধে স্থানীয় অভিজাত মির্জা গোলাম পীর একটি সাধারণ মুঘল ধাঁচের মসজিদ হিসেবে নির্মাণ করেন। ১৯২৬ সালে স্থানীয় ব্যবসায়ী আলী জান বেপারি এর বিখ্যাত পুনঃসজ্জার খরচ বহন করেন — ভাঙা চীনামাটির টুকরো দিয়ে তৈরি শত শত নীল তারা মোজাইক, যাকে বলা হয় চিনিটিকরি। ১৯৮৭ সালের সম্প্রসারণে মসজিদটি তিনটি থেকে পাঁচটি গম্বুজবিশিষ্ট হয়।"}},
  {id:"parliament", icon:iconParliament(),
   title:{en:"National Parliament House", bn:"জাতীয় সংসদ ভবন"}, period:{en:"1961–1982", bn:"১৯৬১–১৯৮২"},
   body:{en:"Jatiyo Sangsad Bhaban was conceived in 1959 and designed by the American architect Louis Kahn, who was commissioned in 1962. Construction began in the early 1960s and was halted during the 1971 Liberation War. The building was finally completed in 1982, a decade after Bangladesh's independence — today it is regarded as one of the most significant works of modern architecture in the world.",
        bn:"জাতীয় সংসদ ভবনের পরিকল্পনা ১৯৫৯ সালে করা হয় এবং আমেরিকান স্থপতি লুই কানকে ১৯৬২ সালে এর নকশার দায়িত্ব দেওয়া হয়। নির্মাণ কাজ ১৯৬০-এর দশকের শুরুতে শুরু হয় এবং ১৯৭১ সালের মুক্তিযুদ্ধের সময় বন্ধ থাকে। বাংলাদেশের স্বাধীনতার এক দশক পর, ১৯৮২ সালে ভবনটি অবশেষে সম্পূর্ণ হয় — আজ এটি বিশ্বের আধুনিক স্থাপত্যের অন্যতম গুরুত্বপূর্ণ নিদর্শন হিসেবে বিবেচিত।"}},
  {id:"dhanmondilake", icon:iconLake(),
   title:{en:"Dhanmondi Lake", bn:"ধানমন্ডি লেক"}, period:{en:"Developed from the 1950s", bn:"১৯৫০ এর দশক থেকে উন্নয়ন"},
   body:{en:"Dhanmondi was developed as Dhaka's first planned elite residential area starting in the early 1950s, with its natural lake preserved as the neighbourhood's centrepiece. Long neglected, the lake was restored into its present park-and-walkway form in 1996. Its shore includes Road 32, home to Bangladesh's founding leader Sheikh Mujibur Rahman, now a museum.",
        bn:"ধানমন্ডি ১৯৫০-এর দশকের শুরুতে ঢাকার প্রথম পরিকল্পিত অভিজাত আবাসিক এলাকা হিসেবে গড়ে ওঠে, যেখানে প্রাকৃতিক লেকটি এলাকার কেন্দ্রবিন্দু হিসেবে সংরক্ষিত থাকে। দীর্ঘদিন অবহেলিত থাকার পর ১৯৯৬ সালে লেকটি বর্তমান পার্ক ও হাঁটার পথসহ রূপে পুনরুদ্ধার করা হয়। এর তীরে রয়েছে রোড ৩২, বাংলাদেশের প্রতিষ্ঠাতা নেতা শেখ মুজিবুর রহমানের বাড়ি, যা এখন জাদুঘর।"}},
  {id:"rickshawart", icon:iconRickshaw(),
   title:{en:"Rickshaw Art", bn:"রিকশা চিত্র"}, period:{en:"Living heritage since the 1950s", bn:"১৯৫০ এর দশক থেকে জীবন্ত ঐতিহ্য"},
   body:{en:"Dhaka's hand-painted rickshaws date back to the 1950s, when street artists began decorating them with flowers, folk scenes, film stars and national heroes — turning slow-moving traffic into a rolling gallery. In December 2023, UNESCO inscribed 'Rickshaws and rickshaw painting in Dhaka' on its Representative List of the Intangible Cultural Heritage of Humanity.",
        bn:"ঢাকার হাতে আঁকা রিকশার ঐতিহ্য ১৯৫০-এর দশক থেকে চলে আসছে, যখন পথশিল্পীরা ফুল, লোকজ দৃশ্য, চলচ্চিত্র তারকা ও জাতীয় বীরদের ছবি দিয়ে রিকশা সাজাতে শুরু করেন — ধীরগতির যানবাহনকে পরিণত করে এক চলমান গ্যালারিতে। ২০২৩ সালের ডিসেম্বরে ইউনেস্কো 'ঢাকার রিকশা ও রিকশা চিত্রকলা'-কে মানবতার অধরা সাংস্কৃতিক ঐতিহ্যের প্রতিনিধিত্বমূলক তালিকায় অন্তর্ভুক্ত করে।"}},
  {id:"purandhaka", icon:iconOldDhaka(),

   body:{en:"The historic core of the city, founded in 1608 as Jahangirabad, capital of Mughal Bengal. Once the centre of the worldwide muslin trade, its narrow lanes still hold centuries of layered history — Mughal forts and mosques, colonial-era buildings, an Armenian church, and some of the city's oldest neighbourhoods and food streets.",

  {id:"sadarghat", icon:iconSadarghat(),
   title:{en:"Sadarghat", bn:"সদরঘাট"}, period:{en:"River port since the 19th century", bn:"১৯ শতক থেকে নদী বন্দর"},
   body:{en:"The 'city wharf' on the Buriganga has been Dhaka's river gateway since the 19th century, when nearby administrative offices turned it into a commercial hub. Its modern terminal, built in 1967, remains one of the busiest river ports in the world, connecting the capital to dozens of southern districts by launch and steamer.",

  {id:"chawkbazar", icon:iconChawkbazar(),
   title:{en:"Chawkbazar", bn:"চকবাজার"}, period:{en:"Marketplace since 1676", bn:"১৬৭৬ সাল থেকে বাজার"},

function locationPicker(selectedId, searchValue, pickAct, searchAct){
  const q = (searchValue||'').trim().toLowerCase();
  const matches = q ? LOCATIONS.filter(l=> l.en.toLowerCase().includes(q) || l.bn.includes(q)) : LOCATIONS;
  return `
  <label class="field-label">${esc(t('locate_precisely'))}</label>
  <div class="searchbar" style="margin:6px 0 10px;">
    ${svgIcon('search',16)}<input placeholder="${esc(t('search_your_area'))}" value="${esc(searchValue||'')}" data-act="${searchAct}">
  </div>
  <div class="map-mock" style="height:170px; margin-bottom:8px;">
    ${LOCATIONS.map(l=>{
      const pos = LOCATION_MAP_POS[l.id] || {x:50,y:50};
      const isSel = l.id===selectedId;
      const isMatch = matches.some(m=>m.id===l.id);
      return `<div class="map-pin" style="left:${pos.x}%; top:${pos.y}%; ${!isMatch&&q?'opacity:.25;':''}" data-act="${pickAct}" data-val="${l.id}" title="${esc(pick(l))}">
        <div class="dotpin" style="${isSel?'background:var(--ink); width:18px; height:18px; box-shadow:0 0 0 4px var(--mint);':''}"></div>
      </div>`;
    }).join('')}
  </div>
  <div class="small muted" style="margin-bottom:8px;">${esc(t('tap_map_or_search'))}</div>
  <div class="chiprow">
    ${matches.length===0 ? `<span class="small muted">${esc(t('no_area_match'))}</span>` :
      matches.map(l=>`<button class="chip ${l.id===selectedId?'active':''}" data-act="${pickAct}" data-val="${l.id}">${l.id===selectedId?svgIcon('check',12)+' ':''}${esc(pick(l))}</button>`).join('')}
  </div>`;
}

function polarPos(angleDeg, radiusPct){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { left: 50 + radiusPct * Math.cos(rad), top: 50 + radiusPct * Math.sin(rad) };
}

function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function todaysGreenAction(){
  return GREEN_ACTIONS[dayOfYear(new Date()) % GREEN_ACTIONS.length];
}
function dateStr(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadGreenProgress(){
  try{
    const raw = localStorage.getItem('dhakalens_green_progress');
    if(!raw) return;
    const saved = JSON.parse(raw);
    const today = dateStr(new Date());
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = dateStr(y);
    if(saved.lastDate === today){ state.greenDoneToday = true; state.greenStreak = saved.streak || 1; state.greenLastDate = saved.lastDate; }
    else if(saved.lastDate === yesterday){ state.greenDoneToday = false; state.greenStreak = saved.streak || 0; state.greenLastDate = saved.lastDate; }
    else { state.greenDoneToday = false; state.greenStreak = 0; state.greenLastDate = null; }
  }catch(e){ /* storage unavailable — start fresh, silently */ }
}
function markGreenDone(){
  if(state.greenDoneToday) return;
  const today = dateStr(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  const wasYesterday = dateStr(y);
  let streak = state.greenStreak || 0;
  streak = (streak > 0 && state.greenLastDate === wasYesterday) ? streak + 1 : 1;
  state.greenDoneToday = true;
  state.greenStreak = streak;
  state.greenLastDate = today;
  try{ localStorage.setItem('dhakalens_green_progress', JSON.stringify({lastDate:today, streak})); }catch(e){ /* storage unavailable */ }
}

function radialHero(){
  const angles = [0,60,120,180,240,300];
  const lines = angles.map(a=>{
    const s = polarPos(a, 19), e = polarPos(a, 34);
    return `<path d="M ${s.left} ${s.top} L ${e.left} ${e.top}"/><circle cx="${s.left}" cy="${s.top}" r="0.8"/><circle cx="${e.left}" cy="${e.top}" r="0.8"/>`;
  }).join('');
  const petals = PETALS.map((p,i)=>{
    const pos = polarPos(angles[i], 38);
    return `<div class="radial-petal" style="left:${pos.left}%; top:${pos.top}%; animation-delay:${(0.15+i*0.12).toFixed(2)}s;" data-act="enter-app-to" data-val="${p.tab}">
      ${p.icon}
      <div class="radial-petal-label">${esc(pick(p))}</div>
    </div>`;
  }).join('');
  return `
  <div class="radial-hero">
    <svg class="radial-lines" viewBox="0 0 100 100">${lines}</svg>
    <div class="radial-center">
      <div class="radial-center-mark">${logoMark(46)}</div>
    </div>
    ${petals}
  </div>`;
}

function computeImpact(){
  const m = IMPACT_MODEL;
  const waterDay = state.impactWater;
  const wasteDay = m.wasteKgPerDay[state.impactWaste];
  const co2Day = m.co2KgPerDay[state.impactTransport];
  const score = Math.round((((waterDay/m.waterMaxLPerDay) + (wasteDay/m.wasteKgPerDay.always) + (co2Day/m.co2KgPerDay.walk)) / 3) * 100);
  const waterYear = waterDay*365, wasteYear = wasteDay*365, co2Year = co2Day*365;
  return {
    waterDay, wasteDay, co2Day, score, waterYear, wasteYear, co2Year,
    drums: Math.round(waterYear / m.litersPerDrum),
    trees: Math.max(1, Math.round(co2Year / m.co2KgPerTreeYear)),
    cityWaterYear: Math.round(waterYear * m.dhakaPopulation),
    cityCo2Tonnes: Math.round((co2Year * m.dhakaPopulation) / 1000),
    cityWasteTonnes: Math.round((wasteYear * m.dhakaPopulation) / 1000),
  };
}

/* ---- search ---- */
function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return null;
  const places = LOCATIONS.filter(l=> pick(l).toLowerCase().includes(q) || l.en.toLowerCase().includes(q));
  const policies = POLICIES.filter(p=> pick(p.title).toLowerCase().includes(q) || p.title.en.toLowerCase().includes(q));
  const issues = ISSUES.filter(i=> pick(i).toLowerCase().includes(q) || i.en.toLowerCase().includes(q));
  return {places, policies, issues};
}

function searchResultsHtml(){
  const r = runSearch(state.searchQuery);
  if(!r) return "";
  const total = r.places.length + r.policies.length + r.issues.length;
  if(total===0) return `<div class="card small muted">${esc(t('search_no_results'))}</div>`;
  let html = `<div class="card">`;
  if(r.places.length){
    html += `<div class="h3">${esc(t('cat_places'))}</div>`;
    r.places.forEach(p=>{ html += `<div class="row between" data-act="goto-location" data-val="${p.id}" style="padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border);"><span>${svgIcon('pin',16)} ${esc(pick(p))}</span><span class="muted small">${esc(t('nav_scan'))} →</span></div>`; });
  }
  if(r.policies.length){
    html += `<div class="h3" style="margin-top:10px;">${esc(t('cat_policies'))}</div>`;
    r.policies.forEach(p=>{ html += `<div class="row between" data-act="open-policy" data-val="${p.id}" style="padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border);"><span>${svgIcon('policy',16)} ${esc(pick(p.title))}</span><span class="badge ${BADGE_CLASS[p.type]}">${esc(typeLabel(p.type))}</span></div>`; });
  }
  if(r.issues.length){
    html += `<div class="h3" style="margin-top:10px;">${esc(t('cat_issues'))}</div>`;
    r.issues.forEach(i=>{ html += `<div class="row between" data-act="goto-report-issue" data-val="${i.id}" style="padding:8px 0;cursor:pointer;"><span>${svgIcon(i.ic,16)} ${esc(pick(i))}</span><span class="muted small">${esc(t('report_issue'))} →</span></div>`; });
  }
  html += `</div>`;
  return html;
}

function avgScore(loc){
  const s = loc.scores; const vals=[s.walkability,s.greenery,s.drainage,100-s.heat,s.mobility,s.accessibility];
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function policiesForLocation(loc){
  // deterministic pick relevant to land-use / water context

  return POLICIES.filter(p=>ids.includes(p.id));
}

/* Deterministic sample "activity" heatmap for the ward/oversight dashboards — seeded
   pseudo-random so it's stable within a session. Illustrative, not live report history. */
function seededRand(seed){ const x = Math.sin(seed)*10000; return x - Math.floor(x); }
function heatmapDays(seed){
  const days = []; const today = new Date();
  for(let i=370;i>=0;i--){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const dow = d.getDay();
    const r = seededRand(seed + i*7.31);
    const weekend = (dow===0||dow===6);
    let count = 0;
    if(!weekend){
      if(r>0.5) count = 1; if(r>0.68) count = Math.round(r*7); if(r>0.85) count = Math.round(r*11); if(r>0.94) count = Math.round(r*14);
    } else if(r>0.82){ count = Math.round(r*4); }
    days.push({ date:d, count });
  }
  return days;
}
function heatmapWeeks(days){ const w=[]; for(let i=0;i<days.length;i+=7) w.push(days.slice(i,i+7)); return w; }
function heatmapMonthLabels(weeks){
  const labels=[]; let lastMonth=-1;
  weeks.forEach((w,idx)=>{
    const m = w[0].date.getMonth();
    if(m!==lastMonth){ labels.push({idx, name:w[0].date.toLocaleDateString(state.lang==='bn'?'bn-BD':'en-US',{month:'short'})}); lastMonth=m; }
  });
  return labels;
}
function heatmapLevel(count){ return count===0?0 : count<3?1 : count<6?2 : count<10?3 : 4; }
function heatmapCellColor(level){ return ['var(--border)','var(--mint)','var(--mint-deep)','var(--primary-500)','var(--ink)'][level]; }

function contributionHeatmap(seed, totalKey, totalRangeText){
  const days = heatmapDays(seed);
  const weeks = heatmapWeeks(days);
  const months = heatmapMonthLabels(weeks);
  const total = days.reduce((a,d)=>a+d.count,0);
  let longest=0, run=0;
  days.forEach(d=>{ if(d.count>0){ run++; longest=Math.max(longest,run); } else run=0; });
  let current=0;
  for(let i=days.length-1;i>=0;i--){ if(days[i].count>0) current++; else break; }
  const cellW = 10, gap = 2, step = cellW+gap;
  return `
  <div class="card">
    <div class="h3">${esc(t('heatmap_title'))}</div>
    <div class="small muted" style="margin-top:2px;">${esc(t('heatmap_sub'))}</div>
    <div class="heatmap-wrap" style="margin-top:12px;">
      <div style="width:${weeks.length*step}px;">
        <div class="heatmap-months">${months.map(m=>`<span style="left:${m.idx*step}px;">${esc(m.name)}</span>`).join('')}</div>
        <div class="heatmap-weeks">
          ${weeks.map(w=>`<div class="heatmap-week">${w.map(d=>`<div class="heatmap-cell" style="background:${heatmapCellColor(heatmapLevel(d.count))};" title="${d.date.toDateString()}: ${d.count}"></div>`).join('')}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="heatmap-legend">
      <span>${esc(t('heatmap_less'))}</span>
      ${[0,1,2,3,4].map(l=>`<div class="heatmap-cell" style="background:${heatmapCellColor(l)};"></div>`).join('')}
      <span>${esc(t('heatmap_more'))}</span>
    </div>
  </div>
  <div class="grid grid-3" style="margin-top:12px;">
    <div class="stat-chip" style="text-align:center; padding:12px 6px;">
      <div class="sc-value" style="font-size:20px;">${total.toLocaleString('en-US')}</div>
      <div class="sc-label">${esc(t(totalKey))}</div>
      <div class="small muted" style="margin-top:2px; font-size:10px;">${esc(totalRangeText)}</div>
    </div>
    <div class="stat-chip" style="text-align:center; padding:12px 6px;">
      <div class="sc-value" style="font-size:20px;">${longest}</div>
      <div class="sc-label">${esc(t('heatmap_longest_streak'))}</div>
    </div>
    <div class="stat-chip" style="text-align:center; padding:12px 6px;">
      <div class="sc-value" style="font-size:20px;">${current}</div>
      <div class="sc-label">${esc(t('heatmap_current_streak'))}</div>
    </div>
  </div>`;
}

function buildNotifications(){
  const list = [];
  if(state.role==='citizen'){
    state.reports.slice().reverse().forEach(r=>{
      if(r.status!=='submitted'){
        list.push({
          ic: r.status==='resolved' ? 'check' : (r.status==='escalated' ? 'alert' : 'pin'),
          title: t('notif_report_status').replace('{id}', r.trackId),
          body: t('notif_report_status_body').replace('{status}', statusLabel(r.status)),
          tab: 'report',
        });
      }
    });
    if(!state.greenDoneToday){
      list.push({ ic:'leaf', title:t('notif_green_title'), body:t('notif_green_body'), tab:'impact' });
    }
    list.push({ ic:'droplet', title:t('notif_area_title'), body:t('notif_area_body'), tab:'scan' });
    list.push({ ic:'policy', title:t('notif_policy_title'), body:t('notif_policy_body'), tab:'policy' });
  } else if(state.role==='ward'){
    const wardLoc = resolvedAuthLocation();
    const queue = state.reports.filter(r=>r.locObj && wardLoc && r.locObj.id===wardLoc.id && r.status==='submitted');
    if(queue.length>0){
      list.push({ ic:'pin', title:t('notif_ward_queue_title'), body:t('notif_ward_queue_body').replace('{n}', queue.length), role:'ward' });
    }
  } else if(state.role==='oversight'){
    const pending = state.escalations.filter(e=>e.status==='escalated');
    if(pending.length>0){
      list.push({ ic:'alert', title:t('notif_oversight_title'), body:t('notif_oversight_body').replace('{n}', pending.length), role:'oversight' });
    }
  }
  return list;
}

function notifPanel(){
  if(!state.notifOpen) return "";

function initialsOf(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '?';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}

/* ---- SCENARIO / SHAPE YOUR STREET ---- */
function screenScenario(){
  const base = {walkability:50, shade:50, parking:50, traffic:50, heat:50};
  const applied = {...base};
  INTERVENTIONS.forEach(iv=>{
    if(state.interventions.has(iv.id)){
      Object.entries(iv.fx).forEach(([k,v])=>{ applied[k] = clamp(applied[k]+v); });
    }
  });
  const metrics = [
    ["walkability", t('walkability')], ["shade", t('shade')], ["parking", t('parking_avail')],
    ["traffic", t('traffic_flow')], ["heat", t('heat')],
  ];
  return `
  ${pageHero(svgIcon('tree'),'scenario_title','scenario_sub')}
  <div class="card">
    <div class="h3">${esc(t('choose_interventions'))}</div>
    <div style="margin-top:10px;">
      ${INTERVENTIONS.map(iv=>`
        <label class="checkline ${state.interventions.has(iv.id)?'checked':''}">
          <input type="checkbox" data-act="toggle-intervention" data-val="${iv.id}" ${state.interventions.has(iv.id)?'checked':''}/>
          ${esc(t(iv.key))}
        </label>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="h3">${esc(t('simulated'))}</div>
    <div style="margin-top:10px;">
      ${metrics.map(([k,label])=>{
        const delta = applied[k]-base[k];
        const arrow = delta>0?svgIcon('arrowUp',14):(delta<0?svgIcon('arrowDown',14):'—');
        const color = (k==='heat'||k==='parking'||k==='traffic') ? (delta<0?'var(--safe)':(delta>0?'var(--crit)':'var(--text-600)')) : (delta>0?'var(--safe)':(delta<0?'var(--crit)':'var(--text-600)'));
        return `<div class="indicator"><span>${esc(label)}</span><div class="row gap8"><div class="meter"><span style="width:${applied[k]}%"></span></div><b style="color:${color}; width:34px; text-align:right;">${arrow}</b></div></div>`;
      }).join('')}
    </div>
    <div class="small muted" style="margin-top:10px;">${esc(t('not_guaranteed'))}</div>
  </div>
  `;
}
function clamp(v){ return Math.max(0, Math.min(100, v)); }
