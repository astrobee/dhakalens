/* ============================= MAIN RENDER ============================= */
function render(){
  document.body.className = (state.lang==='bn'?'lang-bn ':'') + (state.device==='mobile'?'device-mobile':'');
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.lang = state.lang;

  const app = document.getElementById('app');

  if(state.showCover){
    app.innerHTML = `
      ${topBar()}
      <div class="shell"><div class="content" style="padding:0; max-width:none;">${coverScreen()}</div></div>
    `;
    return;
  }

  if(state.showProfile){
    app.innerHTML = `
      ${topBar()}
      <div class="shell"><div class="content" style="max-width:640px; margin:0 auto; width:100%;">
        <button class="btn btn-ghost btn-sm" data-act="close-profile" style="margin-bottom:12px;">← ${esc(t('back'))}</button>
        ${screenProfile()}
      </div></div>
      ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    `;
    return;
  }

  if(state.showEmergency){
    app.innerHTML = `
      ${topBar()}
      <div class="shell"><div class="content" style="max-width:640px; margin:0 auto; width:100%;">
        <button class="btn btn-ghost btn-sm" data-act="close-emergency" style="margin-bottom:12px;">← ${esc(t('back'))}</button>
        ${screenEmergency()}
      </div></div>
    `;
    return;
  }

  if(state.role !== 'citizen'){
    const screenMap = {ward:screenWard, oversight:screenOversight, police:screenPoliceAuth, fire:screenFireAuth};
    const screen = (screenMap[state.role] || screenWard)();
    app.innerHTML = `
      ${topBar()}
      <div class="shell"><div class="content" style="max-width:820px; margin:0 auto; width:100%;">${screen}</div></div>
      ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    `;
    return;
  }

  let screen = "";
  if(state.tab==="home") screen = screenHome();
  else if(state.tab==="policy") screen = screenPolicy();
  else if(state.tab==="explain") screen = screenExplain();
  else if(state.tab==="scan") screen = screenScan();
  else if(state.tab==="report") screen = screenReport();
  else if(state.tab==="community") screen = screenCommunity();
  else if(state.tab==="scenario") screen = screenScenario();
  else if(state.tab==="planner") screen = screenPlanner();
  else if(state.tab==="history") screen = screenHistory();
  else if(state.tab==="food") screen = screenFood();
  else if(state.tab==="places") screen = screenPublicPlaces();
  else if(state.tab==="impact") screen = screenImpact();

  app.innerHTML = `
    ${topBar()}
    <div class="shell">
      ${sidebar()}
      <div class="content">${screen}</div>
    </div>
    ${bottomNav()}
    ${policyDetailModal()}
    ${fullDocModal()}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
  `;
}

/* ============================= EVENTS ============================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, val = el.dataset.val;

  if(act==='lang'){ state.lang = val; render(); return; }
  if(act==='device'){ state.device = val; render(); return; }
  if(act==='role'){ state.role = val; render(); return; }
  if(act==='enter-app'){ state.showCover = false; render(); window.scrollTo({top:0}); return; }
  if(act==='enter-app-to'){ state.showCover = false; state.tab = val || 'home'; render(); window.scrollTo({top:0}); return; }
  if(act==='show-cover'){ state.showCover = true; render(); window.scrollTo({top:0}); return; }
  if(act==='open-profile'){ state.showProfile = true; state.notifOpen = false; render(); window.scrollTo({top:0}); return; }
  if(act==='open-emergency'){ state.showEmergency = true; state.notifOpen = false; state.lastIncidentId = null; state.incidentNote = ''; render(); window.scrollTo({top:0}); return; }
  if(act==='close-emergency'){ state.showEmergency = false; render(); window.scrollTo({top:0}); return; }
  if(act==='toggle-notifications'){ state.notifOpen = !state.notifOpen; render(); return; }
  if(act==='toggle-bookmark'){
    const [type, id] = val.split(':');
    const idx = state.bookmarks.findIndex(b=>b.type===type && b.id===id);
    if(idx>=0) state.bookmarks.splice(idx,1); else state.bookmarks.push({type, id});
    render(); return;
  }
  if(act==='remove-bookmark'){
    const [type, id] = val.split(':');
    const idx = state.bookmarks.findIndex(b=>b.type===type && b.id===id);
    if(idx>=0) state.bookmarks.splice(idx,1);
    render(); return;
  }
  if(act==='notif-click'){
    const list = buildNotifications();
    const n = list[Number(val)];
    state.notifOpen = false;
    if(n){
      if(n.role){ state.role = n.role; state.showProfile = false; }
      else if(n.tab){ state.role = 'citizen'; state.showProfile = false; state.tab = n.tab; }
    }
    render(); window.scrollTo({top:0}); return;
  }
  if(act==='close-profile'){ state.showProfile = false; render(); window.scrollTo({top:0}); return; }
  if(act==='profile-method'){ state.profileMethod = val; state.profileStep = 'form'; if(val==='google'){ state.profileContact = 'citizen@gmail.com (demo)'; } else { state.profileContact=''; } render(); return; }
  if(act==='profile-back'){ state.profileStep = 'choose'; render(); return; }
  if(act==='profile-submit'){ if(state.profileName.trim()){ state.profileSignedIn = true; render(); } return; }
  if(act==='profile-signout'){
    state.profileSignedIn = false; state.profileStep = 'choose'; state.profileMethod = null;
    state.authSignedIn = false; state.authId = '';
    state.policeAuthSignedIn = false; state.policeAuthId = '';
    state.fireAuthSignedIn = false; state.fireAuthId = '';
    render(); return;
  }
  if(act==='auth-submit'){ if(state.authId.trim()){ state.authSignedIn = true; render(); } return; }
  if(act==='police-auth-submit'){ if(state.policeAuthId.trim()){ state.policeAuthSignedIn = true; render(); } return; }
  if(act==='fire-auth-submit'){ if(state.fireAuthId.trim()){ state.fireAuthSignedIn = true; render(); } return; }
  if(act==='station-login'){ state.role = val; state.showEmergency = false; render(); window.scrollTo({top:0}); return; }
  if(act==='incident-location-pick'){ state.incidentLocationId = val; render(); return; }
  if(act==='alert-nearest-station'){
    const id = 'INC-' + Date.now();
    state.incidents.push({ id, locationId: state.incidentLocationId, note: state.incidentNote.trim(), forwarded:false, status:'open' });
    state.lastIncidentId = id;
    render(); window.scrollTo({top:0}); return;
  }
  if(act==='incident-forward'){
    const inc = state.incidents.find(i=>i.id===val);
    if(inc){ inc.forwarded = true; showToast(t('forwarded_done')); }
    return;
  }
  if(act==='incident-respond'){
    const inc = state.incidents.find(i=>i.id===val);
    if(inc){ inc.status = 'responded'; render(); }
    return;
  }
  if(act==='profile-ask-send'){ state.showProfile=false; state.role='citizen'; state.tab='explain'; render(); window.scrollTo({top:0}); return; }
  if(act==='mark-green-done'){ markGreenDone(); render(); return; }
  if(act==='theme'){ state.theme = state.theme==='light'?'dark':'light'; render(); return; }
  if(act==='tab'){ state.tab = val; state.searchQuery=''; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(act==='policy-topic'){ state.policyTopic = val; render(); return; }
  if(act==='open-policy'){ state.activePolicy = val; state.policySimple = true; render(); return; }
  if(act==='close-modal'){ if(e.target===el){ state.activePolicy = null; render(); } return; }
  if(act==='view-fulldoc'){ state.viewingDoc = val; render(); return; }
  if(act==='close-fulldoc'){ if(e.target===el){ state.viewingDoc = null; render(); } return; }
  if(act==='policy-mode'){ state.policySimple = (val==='simple'); render(); return; }
  if(act==='goto-location'){ state.scanLocation = val; state.tab='scan'; state.searchQuery=''; render(); return; }
  if(act==='goto-report-issue'){ state.tab='report'; state.reportStep=2; state.reportIssue=val; state.searchQuery=''; render(); return; }
  if(act==='toggle-method'){ state.showMethod = !state.showMethod; render(); return; }
  if(act==='locate'){ showToast(state.lang==='bn' ? "অবস্থান শনাক্ত করা হয়েছে: ধানমন্ডি" : "Location detected: Dhanmondi"); return; }
  if(act==='use-current-location'){ state.reportLocation = state.lang==='bn' ? "রোড ২৭, ধানমন্ডি (বর্তমান অবস্থান)" : "Road 27, Dhanmondi (current location)"; render(); return; }
  if(act==='report-issue-pick'){ state.reportIssue = val; render(); return; }
  if(act==='report-location-pick'){ state.reportLocationId = val; render(); return; }
  if(act==='report-file'){ /* handled in change listener */ return; }
  if(act==='report-back'){ state.reportStep = Math.max(1, state.reportStep-1); render(); return; }
  if(act==='report-next'){ if(canProceed(state.reportStep)){ state.reportStep = Math.min(5, state.reportStep+1); render(); } return; }
  if(act==='report-submit'){
    if(!state.profileSignedIn){ state.showProfile = true; render(); return; }
    const trackId = "DH-2026-" + Math.floor(100000+Math.random()*899999);
    const locObj = LOCATIONS.find(l=>l.id===state.reportLocationId);
    const issueObj = ISSUES.find(i=>i.id===state.reportIssue);
    state.reports.push({
      id: trackId, trackId, issueId: state.reportIssue, locationId: state.reportLocationId, locObj,
      spot: state.reportLocation, note: state.reportNote, evidence: state.reportEvidence,
      slaDays: issueObj.sla, daysOpen: 0, status: "submitted", wardLog: [],
    });
    state.reportSubmitted = { trackId, location: state.reportLocation, issue: state.reportIssue, locationId: state.reportLocationId };
    render(); window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if(act==='report-reset'){
    state.reportStep=1; state.reportLocation=""; state.reportIssue=null; state.reportEvidence=null; state.reportNote=""; state.reportSubmitted=null;
    render(); return;
  }
  if(act==='vote'){
    if(state.votePoints>0){ state.votes[val]++; state.votePoints--; render(); }
    return;
  }
  if(act==='toggle-intervention'){
    if(state.interventions.has(val)) state.interventions.delete(val); else state.interventions.add(val);
    render(); return;
  }
  if(act==='impact-waste'){ state.impactWaste = val; render(); return; }
  if(act==='impact-transport'){ state.impactTransport = val; render(); return; }
  if(act==='explain-issue-pick'){ state.explainIssue = val; state.explainShow = false; render(); return; }
  if(act==='explain-generate'){ if(state.explainIssue){ state.explainShow = true; render(); } return; }
  if(act==='explain-to-report'){
    const loc = LOCATIONS.find(l=>l.id===state.explainLocation);
    state.reportLocation = pick(loc); state.reportLocationId = state.explainLocation; state.reportIssue = state.explainIssue; state.reportStep = 3;
    state.reportSubmitted = null; state.tab = 'report'; render(); window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if(act==='ward-ack'){
    const r = state.reports.find(x=>x.id===val);
    if(r){ r.status='acknowledged'; wardLogPush(r, state.lang==='bn'?'ওয়ার্ড কর্তৃক গৃহীত হয়েছে':'Acknowledged by ward'); render(); }
    return;
  }
  if(act==='ward-resolve'){
    const r = state.reports.find(x=>x.id===val);
    if(r){ r.status='resolved'; wardLogPush(r, state.lang==='bn'?'ওয়ার্ড কর্তৃক সমাধান হয়েছে':'Marked resolved by ward'); render(); }
    return;
  }
  if(act==='ward-advance'){
    const r = state.reports.find(x=>x.id===val);
    if(r){ r.daysOpen++; render(); }
    return;
  }
  if(act==='ward-escalate'){
    const r = state.reports.find(x=>x.id===val);
    if(r && r.status!=='resolved' && r.status!=='escalated'){
      r.status = 'escalated';
      state.escalations.push({ id:'ESC-'+r.id, report:r, negligence: negligenceText(r), status:'escalated' });
      wardLogPush(r, state.lang==='bn'?'তদারকির জন্য কর্তৃপক্ষে পাঠানো হয়েছে':'Escalated to the relevant authority for oversight');
    }
    render(); return;
  }
  if(act==='oversight-review'){
    const es = state.escalations.find(x=>x.id===val);
    if(es){ es.status='review'; }
    render(); return;
  }
  if(act==='oversight-direct'){
    const es = state.escalations.find(x=>x.id===val);
    if(es){ es.status='review'; es.report.status='acknowledged'; wardLogPush(es.report, state.lang==='bn'?'কর্তৃপক্ষ কর্তৃক পদক্ষেপ নেওয়ার নির্দেশ':'Directed by authority to act'); }
    render(); return;
  }
  if(act==='oversight-resolve'){
    const es = state.escalations.find(x=>x.id===val);
    if(es){ es.status='resolved'; es.report.status='resolved'; wardLogPush(es.report, state.lang==='bn'?'কর্তৃপক্ষ কর্তৃক সমাধান হয়েছে':'Resolved by authority'); }
    render(); return;
  }
  if(act==='noop'){ e.preventDefault(); return; }
});

document.addEventListener('input', (e)=>{
  const el = e.target;
  if(el.dataset.act==='search-input'){ state.searchQuery = el.value; render(); focusSearch('search-input'); }
  if(el.dataset.act==='report-loc-search'){ state.reportLocSearch = el.value; render(); focusSearch('report-loc-search'); }
  if(el.dataset.act==='report-location-input'){ state.reportLocation = el.value; syncNextButton(); }
  if(el.dataset.act==='report-note'){ state.reportNote = el.value; }
  if(el.dataset.act==='explain-detail'){ state.explainDetail = el.value; }
  if(el.dataset.act==='impact-water'){ state.impactWater = Number(el.value); refreshImpactLive(); }
  if(el.dataset.act==='profile-name-input'){ state.profileName = el.value; syncProfileButtons(); }
  if(el.dataset.act==='profile-contact-input'){ state.profileContact = el.value; }
  if(el.dataset.act==='auth-id-input'){ state.authId = el.value; syncProfileButtons(); }
  if(el.dataset.act==='incident-loc-search'){ state.incidentLocSearch = el.value; render(); focusSearch('incident-loc-search'); }
  if(el.dataset.act==='incident-note-input'){ state.incidentNote = el.value; }
  if(el.dataset.act==='police-auth-input'){ state.policeAuthId = el.value; syncProfileButtons(); }
  if(el.dataset.act==='fire-auth-input'){ state.fireAuthId = el.value; syncProfileButtons(); }
});
document.addEventListener('change', (e)=>{
  const el = e.target;
  if(el.dataset.act==='scan-location'){ state.scanLocation = el.value; render(); }
  if(el.dataset.act==='planner-filter'){ state.plannerFilter = el.value; render(); }
  if(el.dataset.act==='explain-location'){ state.explainLocation = el.value; state.explainShow=false; render(); }
  if(el.dataset.act==='report-location-select'){ state.reportLocationId = el.value; render(); }
  if(el.dataset.act==='ward-filter'){ state.wardFilter = el.value; render(); }
  if(el.dataset.act==='auth-ward-select'){
    const parts = el.value.split('-');
    state.authCorp = parts[0]; state.authWardNo = Number(parts[1]);
    render();
  }
  if(el.dataset.act==='profile-area-select'){ state.profileArea = el.value; render(); }
  if(el.dataset.act==='report-file'){
    if(el.files && el.files[0]){ state.reportEvidence = el.files[0].name; render(); }
  }
});
function focusSearch(act){
  const inp = document.querySelector('[data-act="'+(act||'search-input')+'"]');
  if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; }
}
function syncNextButton(){
  const btn = document.querySelector('[data-act="report-next"]');
  if(btn) btn.disabled = !canProceed(state.reportStep);
}
function syncProfileButtons(){
  const pBtn = document.querySelector('[data-act="profile-submit"]');
  if(pBtn) pBtn.disabled = !state.profileName.trim();
  const aBtn = document.querySelector('[data-act="auth-submit"]');
  if(aBtn) aBtn.disabled = !state.authId.trim();
  const poBtn = document.querySelector('[data-act="police-auth-submit"]');
  if(poBtn) poBtn.disabled = !state.policeAuthId.trim();
  const fiBtn = document.querySelector('[data-act="fire-auth-submit"]');
  if(fiBtn) fiBtn.disabled = !state.fireAuthId.trim();
}
let toastTimer=null;
function showToast(msg){
  state.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2400);
}

loadGreenProgress();
render();
</script>

<script id="dhakalens-ai-script">
(() => {
  'use strict';
  const panel = document.getElementById('dl-ai-panel');
  const launcher = document.getElementById('dl-ai-launch');
  const close = document.getElementById('dl-ai-close');
  const list = document.getElementById('dl-ai-messages');
  const question = document.getElementById('dl-ai-question');
  const form = document.getElementById('dl-ai-form');
  const send = document.getElementById('dl-ai-send');
  const status = document.getElementById('dl-ai-status');
  const contextLabel = document.getElementById('dl-ai-context');
  const banner = document.getElementById('dl-ai-notice');
  const tabs = [...document.querySelectorAll('[data-ai-mode]')];
  let mode = 'city';
  let pending = false;
  let latestReply = '';
  const conversations = {city:[], policy:[], report:[]};
  const bilingual = (en,bn) => (typeof state !== 'undefined' && state.lang==='bn') ? bn : en;
  const smallValue = value => String(value == null ? '' : value).slice(0,500);

  function selectedContext(){
    const areaId = mode==='report' ? (state.reportLocationId || state.scanLocation)
      : mode==='policy' ? (state.explainLocation || state.scanLocation)
      : (state.scanLocation || state.profileArea);
    const loc = LOCATIONS.find(l => l.id===areaId) || LOCATIONS[0];
    const issueId = mode==='report' ? state.reportIssue : state.explainIssue;
    const issue = ISSUES.find(i => i.id===issueId);
    const policy = issue ? POLICIES.find(p => p.id===issue.policy) : null;
    const policyEntries = POLICIES.slice(0,14).map(p=>({
      title:p.title?.en, summary:p.summary?.en, authority:p.authority?.en,
      // These are only local prototype entries, not verified or authoritative legal texts.
    }));
    return {
      language:state.lang==='bn'?'Bangla':'English',
      area: {name:loc.en, zone:loc.zone?.en, ward:loc.ward?.en, note:'Prototype-only area classification'},
      issue: issue ? {name:issue.en} : null,
      selectedPolicy:policy ? {title:policy.title?.en, summary:policy.summary?.en, authority:policy.authority?.en} : null,
      report: mode==='report' ? {location:smallValue(state.reportLocation), note:smallValue(state.reportNote), issue:issue?.en||null} : null,
      policyCatalog:mode==='policy' ? policyEntries : [],
      dataReliability:'All area scores, ward mapping, documents and legal claims from this frontend are prototype-only; do not assert them as verified facts.'
    };
  }
  function addMessage(kind, text, opts={}){
    const row=document.createElement('div'); row.className='dl-ai-msg '+kind;
    row.textContent=text;
    if(opts.actions){
      const actions=document.createElement('div');actions.className='dl-ai-actions';
      const copy=document.createElement('button');copy.type='button';copy.textContent=bilingual('Copy answer','উত্তর কপি');
      copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);status.textContent=bilingual('Copied','কপি হয়েছে');}catch{status.textContent=bilingual('Copy failed: select text to copy','কপি হয়নি: টেক্সট সিলেক্ট করুন');}});
      actions.appendChild(copy);
      if(mode==='report'){
        const use=document.createElement('button');use.type='button';use.textContent=bilingual('Use in report note','রিপোর্টের নোটে যুক্ত করুন');
        use.addEventListener('click',()=>{
          state.reportNote=text.slice(0,2600);
          state.showCover=false;state.role='citizen';state.showProfile=false;state.showEmergency=false;state.tab='report';state.reportSubmitted=null;
          state.reportStep=(state.reportIssue && state.reportLocation.trim()) ? 4 : 1;
          render();panel.hidden=true;launcher.setAttribute('aria-expanded','false');
          window.scrollTo({top:0,behavior:'smooth'});
        });
        actions.appendChild(use);
      }
      row.appendChild(actions);
    }
    list.appendChild(row);list.scrollTop=list.scrollHeight;
  }
  function repaint(){
    const ctx=selectedContext();
    contextLabel.textContent=bilingual('Context: ','প্রসঙ্গ: ')+ctx.area.name+(ctx.issue?' · '+ctx.issue.name:'')+bilingual(' (sample data)',' (নমুনা তথ্য)');
    banner.textContent=bilingual(
      'Your question and selected sample area context are sent to Gemini. AI may make mistakes. App policies are unverified. Never treat AI as legal approval. Emergency: call 999.',
      'আপনার প্রশ্ন ও নির্বাচিত এলাকার নমুনা তথ্য Gemini-তে পাঠানো হয়। AI ভুল করতে পারে। নমুনা নীতিমালাকে আইনি অনুমোদন ভাববেন না। জরুরিতে ৯৯৯-এ কল করুন।');
    document.getElementById('dl-ai-title').textContent=bilingual('DhakaLens AI Assistant','DhakaLens AI সহকারী');
    document.getElementById('dl-ai-subtitle').textContent=bilingual('Gemini · Advice, not official decisions','Gemini · পরামর্শ, সরকারি সিদ্ধান্ত নয়');
    tabs.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.aiMode===mode)));
    const placeholders = {
      city:bilingual('Ask about drainage, public space, or urban problems…','ড্রেনেজ, উন্মুক্ত স্থান বা নগর সমস্যা সম্পর্কে জিজ্ঞাসা করুন…'),
      policy:bilingual('Ask which policy area may be relevant…','কোন ধরনের নীতিমালা প্রাসঙ্গিক হতে পারে জিজ্ঞাসা করুন…'),
      report:bilingual('Describe the issue so AI can draft a clear complaint…','সমস্যাটি লিখুন—AI অভিযোগের খসড়া তৈরি করবে…')
    };
    question.placeholder=placeholders[mode];list.replaceChildren();
    if(!conversations[mode].length){
      const welcome={city:bilingual('Ask a question about Dhaka. I can explain likely causes and practical next steps.','ঢাকার কোনো সমস্যা নিয়ে প্রশ্ন করুন। সম্ভাব্য কারণ ও করণীয় ব্যাখ্যা করতে পারি।'),
        policy:bilingual('Ask about a city rule or approval process. I will distinguish the sample policy catalog from verified law.','নগর আইন বা অনুমোদন নিয়ে জিজ্ঞাসা করুন। নমুনা নীতিমালা ও যাচাইকৃত আইনের পার্থক্য জানাব।'),
        report:bilingual('Describe what happened, where, and when. I will draft a report you can review before submitting.','কী ঘটেছে, কোথায় ও কখন—লিখুন। জমা দেওয়ার আগে যাচাইযোগ্য অভিযোগের খসড়া তৈরি করব।')}[mode];
      addMessage('system',welcome);
    }else conversations[mode].forEach(item=>addMessage(item.role==='user'?'user':'assistant',item.text,{actions:item.role==='assistant'}));
  }
  function toggle(open){panel.hidden=!open;launcher.setAttribute('aria-expanded',String(open));if(open){repaint();question.focus();}else{launcher.focus();}}
  launcher.addEventListener('click',()=>toggle(panel.hidden));close.addEventListener('click',()=>toggle(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)toggle(false);});
  tabs.forEach(b=>b.addEventListener('click',()=>{if(pending)return;mode=b.dataset.aiMode;question.value='';latestReply='';repaint();question.focus();}));
  question.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  form.addEventListener('submit',async e=>{
    e.preventDefault();const text=question.value.trim();if(!text||pending)return;
    pending=true;send.disabled=true;status.textContent=bilingual('Thinking…','উত্তর তৈরি হচ্ছে…');
    question.value='';conversations[mode].push({role:'user',text});addMessage('user',text);
    const workingMode=mode;
    try{
      const history=conversations[mode].slice(-7,-1).map(({role,text})=>({role,text}));
      const payload={mode,question:text,history,context:selectedContext()};
      let data={};
      try{
        const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
        data=await r.json().catch(()=>({}));
        if(!r.ok){const e=new Error(data.error||('HTTP '+r.status));e.status=r.status;throw e;}
      }catch(err){
        const cfg=window.DHAKALENS_CONFIG||{};
        if(!(cfg.GEMINI_API_KEY&&(!err.status||[404,405,500,502].includes(err.status))))throw err;
        const sys={city:'You are DhakaLens, an assistant explaining Dhaka neighbourhood conditions in plain language.',policy:'You are DhakaLens, an assistant explaining Bangladesh urban rules and policies simply. Do not give legal advice.',report:'You are DhakaLens, helping citizens draft clear civic issue reports for the right authority.'}[mode]+'\nContext: '+JSON.stringify(payload.context).slice(0,4000)+'\nReply in the user\'s language (English or Bengali).';
        const contents=[...history.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.text||'').slice(0,2000)}]})),{role:'user',parts:[{text}]}];
        const models=cfg.MODELS||[cfg.GEMINI_MODEL||'gemini-3.8-flash','gemini-2.5-flash','gemini-2.0-flash'];
        const hosts=['https://aiplatform.googleapis.com/v1/publishers/google/models/','https://generativelanguage.googleapis.com/v1beta/models/'];
        const body=JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents});
        let gd=null,lastErr='';
        outer:for(const model of models){for(const host of hosts){
          const g=await fetch(host+model+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':cfg.GEMINI_API_KEY},body});
          const j=await g.json().catch(()=>({}));
          if(g.ok){gd=j;break outer;}
          lastErr=model+' @ '+(host.indexOf('aiplatform')>-1?'vertex':'aistudio')+': '+((j.error&&j.error.message)||('HTTP '+g.status));
        }}
        if(!gd)throw new Error(lastErr||'Request failed');
        data={answer:((gd.candidates&&gd.candidates[0]&&gd.candidates[0].content.parts)||[]).map(p=>p.text||'').join('')};
      }
      if(!data.answer)throw new Error('No answer returned.');
      latestReply=data.answer;conversations[workingMode].push({role:'assistant',text:latestReply});
      addMessage('assistant',latestReply,{actions:true});status.textContent=bilingual('Ready','প্রস্তুত');
    }catch(err){
      const error=smallValue(err.message || String(err));
      addMessage('system',bilingual('AI unavailable: ','AI সংযোগ হয়নি: ')+error);
      status.textContent=bilingual('Could not complete request','অনুরোধ সম্পন্ন হয়নি');
    }finally{pending=false;send.disabled=false;question.focus();}
  });
})();
</script>
